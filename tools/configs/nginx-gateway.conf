upstream uwsgi {
    server localhost:8050;
}

# If we are doing debugging in VSCode runserver will be on port 7999
upstream runserver {
    server localhost:7999;
}

server {
    listen 8000 default_server ssl;
    server_name _;

    keepalive_timeout 65;

    ssl_certificate /etc/ansible-automation-platform/gateway/gateway.crt;
    ssl_certificate_key /etc/ansible-automation-platform/gateway/gateway.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # intermediate configuration. tweak to your needs.
    ssl_protocols TLSv1.2;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';
    ssl_prefer_server_ciphers on;

    # HSTS (ngx_http_headers_module is required) (15768000 seconds = 6 months)
    add_header Strict-Transport-Security max-age=15768000;
    add_header X-Content-Type-Options nosniff;


    # API Static files
    location ^~ /static/ {
        alias /opt/aap_gateway/static/;
    }

    # API endpoints
    location ~* /(v3|api|o)/ {
        uwsgi_pass uwsgi;
        include /etc/nginx/uwsgi_params;
        # In development mode, if we get a 502 from uwsgi fallback to the runserver
        error_page 502 = @fallback;
    }

    # UI files
    location ~* \.(json|woff|woff2|jpe?g|png|gif|ico|svg|css|js)$ {
        root /opt/aap_gateway/platform_ui;
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
        try_files $uri =404;
        gzip_static on;
    }

    # UI root
    location / {
        root /opt/aap_gateway/platform_ui;
        autoindex off;
        expires off;
        add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri /index.html =404;
    }

    # Enable scenario where we shutdown uwsgi and launching runserver for debugging purposes
    location @fallback {
        proxy_pass http://runserver;
    }
}
