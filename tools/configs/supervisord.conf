[supervisord]
umask = 022
minfds = 4096
nodaemon = true
pidfile = /var/run/supervisor/supervisord.pid
logfile = /var/log/supervisor/supervisord.log
childlogdir = /var/log/supervisor

[program:nginx]
command = nginx -g "daemon off;" -c /etc/gateway/nginx.conf
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:uwsgi]
command = /opt/aap_gateway/venv/bin/uwsgi /etc/gateway/uwsgi.ini
autorestart = true
stopwaitsecs = 1
stopsignal = KILL
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:control-plane]
command =  /usr/bin/gateway-manage start_grpc_server
autorestart = true
stopwaitsecs = 1
stopsignal = KILL
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:auto-reload]
command = auto-reload /opt/aap_gateway/src/ 'supervisorctl restart gateway-processes:*'
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stdout_events_enabled = true
stderr_events_enabled = true

[group:gateway-processes]
programs = nginx,uwsgi,control-plane
priority = 5

[unix_http_server]
file = /var/run/supervisor/supervisor.sock

[supervisorctl]
serverurl = unix:///var/run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
