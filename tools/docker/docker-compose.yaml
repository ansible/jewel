---
version: "3.8"
services:
  gateway:
    build:
      context: $PWD
      dockerfile: tools/docker/Dockerfile
    command:
      - /usr/bin/launch-gateway
    container_name: tools_aap_gw_1
    depends_on:
      - db
    expose:
      - "8000"
    environment:
      - DJANGO_SETTINGS_MODULE=aap_gateway_api.settings
      - SECRET_KEY=${SECRET_KEY:-somesecret}
      - DATABASE_NAME=gateway
      - DATABASE_USER=gateway
      - DATABASE_PASSWORD=gateway
      - DATABASE_HOST=db
    links:
      - db
    networks:
      - dbnet
    ports:
      - "8000:8000"
    user: "${UID}"
    volumes:
      - $PWD:/opt/aap_gateway/aap_gateway
      - $PWD/tools/configs/nginx.conf:/etc/nginx/nginx.conf
      - $PWD/tools/configs/nginx-gateway.conf:/etc/nginx/conf.d/gateway.conf
      - $PWD/tools/configs/gateway.crt:/etc/nginx/gateway.crt:z
      - $PWD/tools/configs/gateway.key:/etc/nginx/gateway.key:z
      - $PWD/tools/configs/uwsgi.ini:/etc/gateway/uwsgi.ini
      - $PWD/tools/configs/supervisord.conf:/etc/supervisord.conf
  db:
    container_name: tools_aap_gw_db_pgsql_1
    command: run-postgresql -c log_destination=stderr -c log_min_messages=info
    environment:
      - POSTGRESQL_DATABASE=gateway
      - POSTGRESQL_USER=gateway
      - POSTGRESQL_PASSWORD=gateway
    image: quay.io/sclorg/postgresql-15-c9s
    networks:
      - dbnet
    ports:
      - "5432:5432"
    volumes:
      - "aap_gw_db:/var/lib/psql/data"

  proxy:
    build:
      context: $PWD
      dockerfile: tools/docker/envoy.Dockerfile
    ports:
      - "9080:9080"
      - "9090:19000"
    # command: --log-level debug
    volumes:
      - $PWD/tools/configs/proxy.yaml:/etc/envoy/proxy.yaml:Z
      - $PWD/tools/configs/gateway.crt:/etc/envoy/gateway.crt:z
      - $PWD/tools/configs/gateway.key:/etc/envoy/gateway.key:z
    extra_hosts:
      localhost: "host-gateway"
    networks:
      - dbnet

networks:
  dbnet:

volumes:
  aap_gw_db:
    name: tools_aap_gw_db
