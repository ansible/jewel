---
- block:
    - name: Start database container
      shell:
        cmd: "{{ compose_cmd }} up --detach db"

    - name: Wait for port to be opened
      ansible.builtin.wait_for:
        port: "{{ db_port }}"
        delay: 2

    - name: See if keycloak database already exists
      containers.podman.podman_container_exec:
        command: /usr/bin/psql -U {{ db_username }} --command "SELECT 1 FROM pg_database WHERE datname = 'keycloak';"
        name: aap_gw_db_pgsql_1
      changed_when: False
      retries: 3
      delay: 3
      register: db_check

    - name: Create the keycloak database
      containers.podman.podman_container_exec:
        command: /usr/bin/psql -U postgres --command 'CREATE DATABASE keycloak WITH OWNER="{{ db_username }}" encoding "UTF8";'
        name: aap_gw_db_pgsql_1
      register: pg_initialization
      when: "'0 rows' in db_check.stdout"

    - name: Start keycloak
      shell:
        cmd: "{{ compose_cmd }} up --detach keycloak"

    - name: Prepare the gateway realm
      include_tasks: render_realm.yml

    - name: Get a keycloak token
      uri:
        url: "https://localhost:{{ keycloak_exposed_port }}/auth/realms/master/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "admin-cli"
          username: "{{ keycloak_username }}"
          password: "{{ keycloak_password }}"
          grant_type: "password"
        validate_certs: False
      register: keycloak_response
      until: "keycloak_response is successful"
      retries: 50
      delay: 6

    # Sometimes the API is up and running and we can get a key but things are fully initialized so we get a Loading... message
    - name: See if the gateway realm already exists
      containers.podman.podman_container_exec:
        command: /usr/bin/psql -U {{ db_username }} keycloak --command "SELECT 1 FROM realm WHERE id = 'gateway';"
        name: aap_gw_db_pgsql_1
      changed_when: False
      register: realm_check

    # We want to see if we can make a call to the keycloak realm to see if the gateway realm exists and not do this step if so
    - name: Create the gateway realm if it does not exists
      uri:
        url: "https://localhost:{{ keycloak_exposed_port }}/auth/admin/realms"
        method: POST
        body_format: json
        body: "{{ lookup('file', keycloak_realm_template) }}"
        validate_certs: False
        headers:
          Authorization: "Bearer {{ keycloak_response.json.access_token }}"
        # 409 conflict is returned if the realm already exists
        status_code: [201, 409]
      when: "'0 rows' in realm_check.stdout"
      register: realm_status
      changed_when: realm_status.status == 201

    - name: Reconcile the Keycloak development realm
      include_tasks: reconcile.yml

    - name: Set passwords for gateway realm users
      uri:
        url: "https://localhost:{{ keycloak_exposed_port }}/auth/admin/realms/gateway/users/{{ item.id }}/reset-password"
        method: PUT
        body_format: json
        body:
          type: password
          value: "{{ keycloak_password }}"
          temporary: false
        validate_certs: False
        headers:
          Authorization: "Bearer {{ keycloak_response.json.access_token }}"
        status_code: [204]
      loop:
        - { id: "667ec049-cdf3-45d0-a4dc-0465f7505954", name: "gateway_admin" }
        - { id: "32559338-d619-47e5-839c-cd8c70e4221e", name: "gateway_unpriv" }
        - { id: "cbe48149-3bc5-49a1-a616-c8a5c8a3a88f", name: "gateway_auditor" }
      loop_control:
        label: "{{ item.name }}"
      when: realm_status is changed

  always:
    - name: Shutdown containers we started
      shell:
        cmd: "{{ compose_cmd }} stop {{ container }}"
      loop:
        - keycloak
        - db
      loop_control:
        loop_var: container
