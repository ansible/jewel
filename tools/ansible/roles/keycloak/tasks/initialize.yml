---
- block:
    - name: Fetch Docker context
      community.docker.docker_context_info:
        only_current: true
      when: docker_host is not defined
      ignore_errors: true
      register: docker_context

    - name: Set Docker socket path
      when: docker_context is not skipped and docker_context is success
      set_fact:
        docker_host: "{{ docker_context.contexts[0].config.docker_host }}"

    - name: Start database container
      shell:
        cmd: "{{ docker_compose_cmd }} up db -d --wait"

    - name: Wait for port to be opened
      ansible.builtin.wait_for:
        port: "{{ db_port }}"
        delay: 2

    - name: See if keycloak database already exists
      community.docker.docker_container_exec:
        command: /usr/bin/psql -U {{ db_username }} --command "SELECT 1 FROM pg_database WHERE datname = 'keycloak';"
        container: aap_gw_db_pgsql_1
        docker_host: "{{ docker_host | default(omit) }}"
      changed_when: False
      retries: 3
      delay: 3
      register: db_check

    - name: Create the keycloak database
      community.docker.docker_container_exec:
        command: /usr/bin/psql -U postgres --command 'CREATE DATABASE keycloak WITH OWNER="{{ db_username }}" encoding "UTF8";'
        container: aap_gw_db_pgsql_1
        docker_host: "{{ docker_host | default(omit) }}"
      register: pg_initialization
      when: "'0 rows' in db_check.stdout"

    - name: Create keycloak certs directory
      file:
        path: "{{ keycloak_certs_dir }}"
        state: directory
        mode: '0755'

    - name: Generate certificates for keycloak
      command: 'openssl req -new -x509 -days 365 -nodes -out {{ public_key_file }} -keyout {{ private_key_file }} -subj "{{ cert_subject }}"'
      args:
        creates: "{{ public_key_file }}"

    - name: Generate public cert for keycloak
      command: 'openssl x509 -pubkey -noout -in {{ public_key_file }} -out {{ public_key_cert }}'
      args:
        creates: "{{ public_key_cert }}"

    - name: Start keycloak
      shell:
        cmd: "{{ docker_compose_cmd }} up keycloak -d --wait"

    - name: Load certs, existing and new SAML settings
      set_fact:
        private_key: "{{ private_key_content }}"
        public_key: "{{ public_key_content }}"
        public_key_trimmed: "{{ public_key_content | regex_replace('-----BEGIN CERTIFICATE-----\\\\n', '') | regex_replace('\\\\n-----END CERTIFICATE-----', '') }}"
      vars:
        # We add the extra \\ in here so that when jinja is templating out the files we end up with \n in the strings.
        public_key_content: "{{ lookup('file', public_key_file) | regex_replace('\n', '\\\\n') }}"
        private_key_content: "{{ lookup('file', private_key_file) | regex_replace('\n', '\\\\n') }}"

    - name: Get a keycloak token
      uri:
        url: "https://localhost:{{ keycloak_exposed_port }}/auth/realms/master/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "admin-cli"
          username: "{{ keycloak_username }}"
          password: "{{ keycloak_password }}"
          grant_type: "password"
        validate_certs: False
      register: keycloak_response
      until: "keycloak_response is successful"
      retries: 50
      delay: 6

    - name: Template the gateway realm
      template:
        src: keycloak.gateway.realm.json.j2
        dest: "{{ keycloak_realm_template }}"

    # Sometimes the API is up and running and we can get a key but things are fully initialized so we get a Loading... message
    - name: See if the gateway realm already exists
      community.docker.docker_container_exec:
        command: /usr/bin/psql -U {{ db_username }} keycloak --command "SELECT 1 FROM realm WHERE id = 'gateway';"
        container: aap_gw_db_pgsql_1
        docker_host: "{{ docker_host | default(omit) }}"
      changed_when: False
      register: realm_check

    # We want to see if we can make a call to the keycloak realm to see if the gateway realm exists and not do this step if so
    - name: Create the gateway realm if it does not exists
      uri:
        url: "https://localhost:{{ keycloak_exposed_port }}/auth/admin/realms"
        method: POST
        body_format: json
        body: "{{ lookup('file', keycloak_realm_template) }}"
        validate_certs: False
        headers:
          Authorization: "Bearer {{ keycloak_response.json.access_token }}"
        # 409 conflict is returned if the realm already exists
        status_code: [201, 409]
      when: "'0 rows' in realm_check.stdout"
      register: realm_status
      changed_when: realm_status.status == 201

    - name: Set passwords for gateway realm users
      uri:
        url: "https://localhost:{{ keycloak_exposed_port }}/auth/admin/realms/gateway/users/{{ item.id }}/reset-password"
        method: PUT
        body_format: json
        body:
          type: password
          value: "{{ keycloak_password }}"
          temporary: false
        validate_certs: False
        headers:
          Authorization: "Bearer {{ keycloak_response.json.access_token }}"
        status_code: [204]
      loop:
        - { id: "667ec049-cdf3-45d0-a4dc-0465f7505954", name: "gateway_admin" }
        - { id: "32559338-d619-47e5-839c-cd8c70e4221e", name: "gateway_unpriv" }
        - { id: "cbe48149-3bc5-49a1-a616-c8a5c8a3a88f", name: "gateway_auditor" }
      loop_control:
        label: "{{ item.name }}"
      when: realm_status is changed

  always:
    - name: Shutdown containers we started
      shell:
        cmd: "{{ docker_compose_cmd }} stop {{ container }}"
      loop:
        - keycloak
        - db
      loop_control:
        loop_var: container
