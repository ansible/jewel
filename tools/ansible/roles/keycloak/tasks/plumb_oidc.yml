---
- name: OIDC authenticator
  ansible.platform.authenticator:
    name: "{{ oidc_adapter_name }}"
    slug: "{{ oidc_slug }}"
    enabled: True
    create_objects: True
    remove_users: True
    configuration: "{{ oidc_configuration }}"
    type: "ansible_base.authentication.authenticator_plugins.keycloak"

- name: OIDC authenticator superuser attribute map
  ansible.platform.authenticator_map:
    name: "{{ oidc_auth_map_name }} - superuser"
    authenticator: "{{ oidc_adapter_name }}"
    map_type: "is_superuser"
    order: 0
    triggers: "{\"attributes\":{\"is_superuser\": {}, \"join_condition\": \"or\"}}"

- name: OIDC authenticator auditor attribute map
  ansible.platform.authenticator_map:
    name: "{{ oidc_auth_map_name }} - auditor"
    authenticator: "{{ oidc_adapter_name }}"
    map_type: "role"
    role: "Platform Auditor"
    order: 0
    triggers: "{\"attributes\":{\"is_system_auditor\": {}, \"join_condition\": \"or\"}}"

- name: OIDC authenticator org map
  ansible.platform.authenticator_map:
    name: "{{ oidc_auth_map_name }} - org"
    authenticator: "{{ oidc_adapter_name }}"
    map_type: "organization"
    role: "Organization Member"
    organization: "Default"
    order: 0
    triggers:
      always: {}
