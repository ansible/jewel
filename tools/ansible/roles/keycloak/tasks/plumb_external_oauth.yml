---
- name: External OAuth authenticator
  ansible.platform.authenticator:
    name: "{{ external_oauth_adapter_name }}"
    slug: "{{ external_oauth_slug }}"
    enabled: true
    create_objects: true
    remove_users: true
    configuration: "{{ external_oauth_configuration }}"
    type: "ansible_base.authentication.authenticator_plugins.external_oauth"

- name: External OAuth authenticator superuser attribute map
  ansible.platform.authenticator_map:
    name: "{{ external_oauth_auth_map_name }} - superuser"
    authenticator: "{{ external_oauth_adapter_name }}"
    map_type: "is_superuser"
    order: 0
    triggers: "{\"attributes\":{\"is_superuser\": {}, \"join_condition\": \"or\"}}"

- name: External OAuth authenticator auditor attribute map
  ansible.platform.authenticator_map:
    name: "{{ external_oauth_auth_map_name }} - auditor"
    authenticator: "{{ external_oauth_adapter_name }}"
    map_type: "role"
    role: "Platform Auditor"
    order: 0
    triggers: "{\"attributes\":{\"is_system_auditor\": {}, \"join_condition\": \"or\"}}"

- name: External OAuth authenticator organization map
  ansible.platform.authenticator_map:
    name: "{{ external_oauth_auth_map_name }} - org"
    authenticator: "{{ external_oauth_adapter_name }}"
    map_type: "organization"
    role: "Organization Member"
    organization: "Default"
    order: 0
    triggers:
      always: {}
