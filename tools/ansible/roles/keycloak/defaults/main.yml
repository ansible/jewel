---
keycloak_certs_dir: "{{ sources_dest }}/keycloak_certs"
private_key_file: "{{ keycloak_certs_dir }}/tls.key"
public_key_file: "{{ keycloak_certs_dir }}/tls.crt"
public_key_cert: "{{ keycloak_certs_dir }}/tls.pub"
keycloak_realm_template: "{{ sources_dest }}/keycloak.gateway.realm.json"
oidc_adapter_name: "Dev Keycloak OIDC"
oidc_slug: "keycloak_oidc_dev"
oidc_auth_map_name: "Dev Keycloak OIDC Map"
url_base: "https://{{ (oidc_reference == '') | ternary(oidc_reference, container_reference) }}:{{ keycloak_exposed_port }}"

oidc_configuration:
  ACCESS_TOKEN_URL: "https://keycloak:{{ keycloak_exposed_port }}/auth/realms/gateway/protocol/openid-connect/token"
  AUTHORIZATION_URL: "{{ url_base }}/auth/realms/gateway/protocol/openid-connect/auth"
  KEY: "gateway_oidc_client"
  PUBLIC_KEY: "{{ oidc_public_key }}"
  SECRET: "7b1c3527-8702-4742-af69-2b74ee5742e8"
  ADDITIONAL_UNVERIFIED_ARGS:
    VERIFY_SSL: "{{ gateway_validate_certs }}"

external_oauth_adapter_name: "Dev Keycloak External OAuth"
external_oauth_slug: "keycloak_external_oauth_dev"
external_oauth_auth_map_name: "Dev Keycloak External OAuth Map"
# Keycloak writes requested client scopes to the standard OIDC `scope` claim.
# A token with the write scope is permitted to perform write operations in addition to read operations.
# A token with the read scope is permitted to perform read operations only.
# A token with neither scope is not allowed to perform any operations.
keycloak_token_scope_attribute_name: "scope"
keycloak_token_read_scope_name: "read"
keycloak_token_write_scope_name: "write"
external_oauth_configuration:
  ISSUER_URL: "https://keycloak:{{ keycloak_exposed_port }}/auth/realms/gateway"
  JWKS_URI: "https://keycloak:{{ keycloak_exposed_port }}/auth/realms/gateway/protocol/openid-connect/certs"
  ALLOWED_ALGORITHMS:
    - RS256
  AUDIENCE: "gateway_oidc_client"
  JWKS_CACHE_TIMEOUT: 3600
  CLAIM_LIST:
    - preferred_username
    - sub
    - client_id
    - azp
    - is_superuser
    - is_system_auditor
  GROUPS_CLAIM: Group
  SCOPE_ATTRIBUTE_NAME: "{{ keycloak_token_scope_attribute_name }}"
  WRITE_SCOPE_NAME: "{{ keycloak_token_write_scope_name }}"
  READ_SCOPE_NAME: "{{ keycloak_token_read_scope_name }}"
  USERINFO_URL: ""
  OIDC_ENDPOINT: ""
  VERIFY_SSL: false

saml_adapter_name: "Dev Keycloak SAML"
saml_slug: "keycloak_saml_dev"
saml_auth_map_name: "Dev Keycloak SAML Map"
saml_configuration:
  EXTRA_DATA: []
  IDP_ATTR_EMAIL: email
  IDP_ATTR_FIRST_NAME: first_name
  IDP_ATTR_LAST_NAME: last_name
  IDP_ATTR_USERNAME: username
  IDP_ATTR_USER_PERMANENT_ID: name_id
  IDP_ENTITY_ID: "https://{{ container_reference }}:{{ keycloak_exposed_port }}/auth/realms/gateway"
  IDP_GROUPS: groups
  IDP_URL: "https://{{ container_reference }}:{{ keycloak_exposed_port }}/auth/realms/gateway/protocol/saml"
  IDP_X509_CERT: "{{ public_key | regex_replace('\\n', '') }}"
  ORG_INFO:
    en-US:
      url: "https://{{ container_reference }}"
      name: Gateway Developers
      displayname: Gateway Developer Engineering
  SECURITY_CONFIG:
    requestedAuthnContext: false
  SP_ENTITY_ID: gateway
  SP_EXTRA: {}
  SP_PRIVATE_KEY: "{{ private_key }}"
  SP_PUBLIC_CERT: "{{ public_key }}"
  SUPPORT_CONTACT:
    givenName: Me Myself
    emailAddress: noone@nowhere.com
  TECHNICAL_CONTACT:
    givenName: Me Myself
    emailAddress: noone@nowhere.com
