---
- name: Create LDAP cert directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ ldap_cert_dir }}"
    - "{{ ldap_diff_dir }}"

- name: General LDAP cert
  ansible.builtin.command: 'openssl req -new -x509 -days 365 -nodes -out {{ ldap_public_key_file }} -keyout {{ ldap_private_key_file }} -subj "{{ ldap_cert_subject }}"'
  args:
    creates: "{{ ldap_public_key_file }}"

- name: Template ldap.diff
  ansible.builtin.template:
    src: "ldap.ldif.j2"
    dest: "{{ ldap_diff_dir }}/ldap.ldif"
