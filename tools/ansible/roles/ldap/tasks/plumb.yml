---
- name: Load the existing authenticators
  uri:
    url: "{{ gateway_host }}/api/gateway/v1/authenticators/?name={{ ldap_container_name | urlencode }}"
    validate_certs: False
    url_username: "{{ gateway_admin_username }}"
    url_password: "{{ gateway_admin_password }}"
    force_basic_auth: True
  register: existing_authenticators

- name: See if our authenticator exists
  set_fact:
    authenticator_number: "{{ item.id }}/"
    title: "Updating existing authenticator"
    method: PUT
    statuses:
     - 200
  loop: "{{ existing_authenticators.json.results | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name == ldap_configuration.name

- name: Set default variables
  set_fact:
    authenticator_number: ''
    title: "Configure a new authenticator"
    method: POST
    statuses:
     - 201
  when: authenticator_number is not defined

- name: "{{ title }}"
  uri:
    url: "{{ gateway_host }}/api/gateway/v1/authenticators/{{ authenticator_number }}"
    method: "{{ method }}"
    body: "{{ ldap_configuration }}"
    body_format: json
    validate_certs: False
    url_username: "{{ gateway_admin_username }}"
    url_password: "{{ gateway_admin_password }}"
    force_basic_auth: True
    status_code: "{{ statuses }}"
  changed_when: True
