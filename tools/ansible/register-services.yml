---
- name: Playbook to configure automation platform gateway data
  hosts: localhost
  connection: local
  vars:
    gateway_username: "{{ gateway_admin_username }}"
    gateway_password: "{{ gateway_admin_password }}"
    gateway_hostname: "{{ gateway_host }}"
    gateway_validate_certs: False
    gateway_state: present
  module_defaults:
    group/ansible.platform.gateway:
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
      state: "{{ gateway_state }}"

  tasks:
    - name: Check if API is available and returning status 200
      uri:
        url: "{{ gateway_hostname }}/api/"
        validate_certs: "{{ gateway_validate_certs|default(False) }}"
      register: result
      until: "result.status == 200"
      retries: 10
      delay: 5

    - name: Manage HTTP ports
      ansible.platform.http_port:
         is_api_port: "{{ item.is_api_port }}"
         name: "{{ item.name }}"
         number: "{{ item.number }}"
         use_https: "{{ item.use_https}}"
      loop: "{{ gateway_http_ports | default([]) }}"
    
    - name: Manage service_types
      ansible.platform.service_type:
        name: "{{ item.name }}"
        ping_url: "{{ item.ping_url | default(omit) }}"
        login_path: "{{ item.login_path | default(omit) }}"
        logout_path: "{{ item.logout_path | default(omit) }}"
        service_index_path: "{{ item.service_index_path | default(omit) }}"
      loop: "{{ gateway_service_types | default([]) }}"

    - name: Manage service_clusters
      ansible.platform.service_cluster:
        name: "{{ item.name }}"
        service_type: "{{ item.service_type }}"
        health_checks_enabled: "{{ item.health_checks_enabled | default(True) }}"
        auth_type: "{{ item.auth_type | default(omit) }}"
        upstream_hostname: "{{ item.upstream_hostname | default(omit) }}"
        dns_discovery_type: "{{ item.dns_discovery_type | default(omit) }}"
        dns_lookup_family: "{{ item.dns_lookup_family | default(omit) }}"

      loop: "{{ gateway_service_clusters | default([]) }}"

    - name: Manage service_nodes
      ansible.platform.service_node:
        name: "{{ item.name }}"
        service_cluster: "{{ item.service_cluster }}"
        address: "{{ item.address }}"
      loop: "{{ gateway_service_nodes | default([]) }}"

    - name: Manage services
      ansible.platform.service:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        api_slug: "{{ item.api_slug }}"
        http_port: "{{ item.http_port }}"
        service_cluster: "{{ item.service_cluster }}"
        is_service_https: "{{ item.is_service_https | default(False) }}"
        service_path: "{{ item.service_path }}"
        service_port: "{{ item.service_port }}"
        order: "{{ item.order }}"
        is_internal_route: "{{ item.is_internal_route | default(omit) }}"
      loop: "{{ gateway_services | default([]) }}"

    - name: Manage routes
      ansible.platform.route:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        gateway_path: "{{ item.gateway_path }}"
        http_port: "{{ item.http_port }}"
        service_cluster: "{{ item.service_cluster }}"
        is_service_https: "{{ item.is_service_https | default(False) }}"
        service_path: "{{ item.service_path }}"
        service_port: "{{ item.service_port }}"
        enable_gateway_auth: "{{ item.enable_gateway_auth }}"
        is_internal_route: "{{ item.is_internal_route | default(omit) }}"
      loop: "{{ gateway_routes | default([]) }}"
...
