---
gateway_host: https://localhost:8000
gateway_port: 8000
# If you are running on Linux you likely will want to change this port to 9043 or something else > 1024 if not running podman as root
proxy_port: 443
db_username: gateway
db_password: gateway
db_port: 5440
container_reference: localhost
# This is where to put all the docker source files relative to the tools/docker-compose/ansible directory
sources_dest: '{{ playbook_dir | dirname }}/generated'
docker_compose_cmd: "{{ lookup('ansible.builtin.env', 'DOCKER_COMPOSE', default='docker compose') }} -f {{ sources_dest }}/docker-compose.yml"

container_engine: docker
gateway_image: 'quay.io/ansible/jewel:devel' # placeholder until public image available
gateway_host_address: host-gateway
gateway_services: "{{ enabled_services | default([], true) }}"
gateway_container_name: aap_gw_1

ddt_enabled: "{{ enable_django_debug_toolbar | default(False) }}"

enabled_containers:
  keycloak: "{{ keycloak_enabled | default(False) }}"
  ldap: "{{ ldap_enabled | default(False) }}"
  tacacs: "{{ tacacs_enabled | default(False) }}"
  radius: "{{ radius_enabled | default(False) }}"
  haproxy: "{{ haproxy_enabled | default(False) }}"
  otel_collector: "{{ otel_enabled | default(False) }}"
  loki: "{{ otel_enabled | default(False) }}"
  tempo: "{{ otel_enabled | default(False) }}"
  grafana: "{{ otel_enabled | default(False) }}"

# Redis settings
redis_mode_options:
  - standalone
  - sentinel
  - cluster
redis_node_topology_count:
  standalone: 1
  sentinel: 1
  cluster: 6
redis_sentinel_replica_nodes: 1
redis_sentinel_sentinel_nodes: 3
redis_mode: "{{ redis_type | default(redis_mode_options[0]) }}"
redis_node_count: "{{ redis_node_topology_count[redis_mode] | default(1) }}"
redis_uses_tls: "{{ redis_tls_enabled | default(True) }}"
redis_node_prefix: 'aap_gw_redis_'
cache_key_prefix: 'gateway'

# Keycloak settings
keycloak_exposed_port: 8443
keycloak_image: quay.io/keycloak/keycloak
keycloak_image_version: 26.0
keycloak_username: admin
keycloak_password: admin
cert_subject: "/C=US/ST=NC/L=Durham/O=gateway/CN=devenv"
oidc_reference:

# LDAP docker compose settings
ldap_exposed_ldap_port: 389
ldap_exposed_ldaps_port: 636
ldap_image_version: latest
ldap_admin_username: admin
ldap_admin_password: admin
ldap_public_key_file_name: 'ldap.cert'
ldap_private_key_file_name: 'ldap.key'

# Tacacs plus
tacacs_container_version: latest
tacacs_exposed_tacacs_port: 49

# RADIUS
radius_image: "mirror.gcr.io/freeradius/freeradius-server"
radius_image_version: latest

# Redis — Fedora image is amd64-only; use GCR mirror multi-arch image on macOS
_redis_use_multiarch: "{{ lookup('pipe', 'uname -s') == 'Darwin' }}"
redis_container_image: "{{ 'mirror.gcr.io/library/redis' if _redis_use_multiarch else 'quay.io/fedora/redis-6' }}"
redis_container_version: "{{ '6' if _redis_use_multiarch else 'latest' }}"
redis_exposed_port: 6380
redis_username: gateway1
redis_password: redis_password
redis_sentinel_username: redis_sentinel_username
redis_sentinel_password: redis_sentinel_password

# Envoy proxy
envoy_proxy_image: mirror.gcr.io/envoyproxy/envoy
envoy_proxy_version: v1.36.6

# HAProxy
proxy_container_version: latest

# OTEL Collector
otel_collector_image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
otel_collector_image_version: latest
otel_collector_grpc_port: 4317
otel_collector_http_port: 4318
otel_collector_prometheus_port: 8889
otel_collector_host: otel-collector

# Loki
loki_image: docker.io/grafana/loki
loki_image_version: latest
loki_http_port: 3100

# Tempo
tempo_image: docker.io/grafana/tempo
tempo_image_version: latest
tempo_http_port: 3200

# Grafana
grafana_image: docker.io/grafana/grafana
grafana_image_version: latest
grafana_http_port: 3000
