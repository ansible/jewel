[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "aap_gateway_api.tests.settings_overrides"
addopts = "--strict-markers --reuse-db --migrations -s -vvv"

[tool.tox]
legacy_tox_ini = """
    [tox]
    min_version = 4.0
    no_package = true
    env_list =
        py311
        py310
        py39

    [testenv]
    deps =
        -r{toxinidir}/../requirements/requirements_dev.txt
        -r{toxinidir}/../requirements/requirements.txt
    commands = pytest --cov=. --cov-report=xml:coverage.xml --cov-report=html {posargs}

"""

[tool.coverage.run]
omit = ["tests/*"]
