proxy:
  use_tls: true
  api_port: 9080

# Dictionary of services to be served under /api/<key>/.
services:
  gateway:
    use_tls: true
    api_port: 8000
    control_plane_port: 50051
    service_root: /api/gateway/
    type: gateway

    nodes:
      - address: "gateway"

  hub:
    use_tls: true
    service_root: /api/galaxy/
    api_port: 5001
    type: hub

    nodes:
      - address: "localhost"

    additional_routes:
      - name: "hub container registry"
        description: "Hub Container Registry."
        gateway_path: "/v2/"
      - name: "hub container registry tokens"
        description: "Hub Container Registry Tokens."
        gateway_path: "/token/"
        # Only /token/ is marked because that's where the anonymous token
        # issuance happens; /v2/ relies on the standard Www-Authenticate
        # challenge flow.
        reject_failed_basic_auth: true
      - name: "hub ui"
        description: "Hub UI"
        gateway_path: "/ui/"
      - name: "hub ui static files"
        description: "Hub UI Static Files"
        gateway_path: "/static/galaxy_ng/"

  controller:
    use_tls: true
    service_root: /api/
    api_port: 8043
    type: controller

    nodes:
      - address: "localhost"

  eda:
    use_tls: true
    service_root: /api/
    api_port: 8000
    type: eda

    nodes:
      - address: "localhost"
