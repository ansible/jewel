---
image: quay.io/centos/centos:stream9-minimal

.before_script_template:
  before_script:
    - microdnf install -y --nodocs --setopt=install_weak_deps=0 python3.11-pip make
    - pip3.11 install -r requirements/requirements_dev.txt

include:
  - project: enterprise-pipelines/gitlab-ci/includes
    file: SAST/sonarqube.yml

stages:
  - linting & testing
  - external-testing
  - publish

push_devel_image:
  stage: publish
  tags:
    - shared
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/tools/docker/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:devel"
  rules:
    - if: $CI_COMMIT_BRANCH == "devel"

flake8:
  extends: .before_script_template
  stage: linting & testing
  tags:
    - shared
  script:
    - make check_flake8
  only:
    - merge_request

black:
  extends: .before_script_template
  stage: linting & testing
  tags:
    - shared
  script:
    - make check_black
  only:
    - merge_request

isort:
  extends: .before_script_template
  stage: linting & testing
  tags:
    - shared
  script:
    - make check_isort
  only:
    - merge_request

service_lib_tests:
  parallel:
    matrix:
      - TOX_PYTHON: "py311"
        TOX_DJANGO: ["django41", "django42"]
  extends: .before_script_template
  stage: linting & testing
  tags:
    - shared
  script:
    - TOX_ARGS="-e ${TOX_PYTHON}-${TOX_DJANGO} -- --junitxml=results-${TOX_PYTHON}-${TOX_DJANGO}.xml" make test_service_lib
  artifacts:
    untracked: true
    reports:
      junit: service_lib/results*.xml
  interruptible: true
  only:
    - merge_request

sonarqube:
  stage: external-testing
  tags:
    - shared
  dependencies:
    - service_lib_tests
  interruptible: true
  needs:
    - service_lib_tests
  image: images.paas.redhat.com/alm/sonar-scanner-alpine:latest
  variables:
    LANG: "en_US.UTF-8"
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
    SONAR_HOST_URL: https://sonarqube.corp.redhat.com
    SONAR_USER_HOME: /tmp/.sonar
    SONAR_SCANNER_OPTS: "-Xmx512m"
    KUBERNETES_MEMORY_REQUEST: "512Mi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "512Mi"
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: "1Gi"
  script:
    - >
      set -x; sonar-scanner # -Dsonar.qualitygate.wait=true
      # TODO: Uncomment the qualitygate wait when we have enough coverage
  timeout: 15 minutes
  # sonar-scanner image already has a basic cache of sonarqube files but
  # individual projects may have additional project-specific cache files
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - "${SONAR_USER_HOME}/cache"
  only:
    - merge_request
