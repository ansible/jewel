---
# INSTALL:
#   Setup a variable called DOCKER_AUTH_CONFIG in the secrets
#     The use of printf (as opposed to echo) prevents encoding a newline in the password.
#     printf "my_username:my_password" | openssl base64 -A
#
#     Example output to copy
#       bXlfdXNlcm5hbWU6bXlfcGFzc3dvcmQ=
#
#     The contents of the variable:
#       {
#           "auths": {
#               "registry.example.com:5000": {
#                   "auth": "bXlfdXNlcm5hbWU6bXlfcGFzc3dvcmQ="
#               }
#           }
#       }
#
#  Setup a variable called quay secret QUAY_ROBOT_TOKEN
#  Generate a robot for quay.io https://docs.redhat.com/en/documentation/red_hat_quay/3.8/html-single/red_hat_quay_api_guide/index#create_oauth_access_token
#
#  Setup a variable called QUAY_REPO (like rhn_gps_jowestco/gitlab_ci_testing)
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "stable-2.5"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "stable-2.5"


.base_before_script_template:
  before_script:
    - sed -i '/^\[crb\]$/,/^enabled=0$/ s/enabled=0/enabled=1/' /etc/yum.repos.d/centos.repo
    - dnf install -y python3.11 python3.11-pip make ansible-core libxml2-devel xmlsec1-devel xmlsec1-openssl-devel libtool-ltdl-devel openldap-devel xmlsec1 git gcc python3.11-devel
    - pip3.11 install tox

# TODO:
#   Finish container creating and pushing
#   Push up a built gateway container?
#   Implement the checkout DAB version script in the image build (if unspecified pull from gitlab stable 2.5)
#   Finish ATF tasks
default:
  tags:
    - shared-podman
  image:
    name: quay.io/centos/centos:stream9
  before_script:
    - !reference [".base_before_script_template", "before_script"]

.unit_testing_before_script_template:
  before_script:
    - !reference [".base_before_script_template", "before_script"]
    - git -c http.sslVerify=false clone https://gitlab.cee.redhat.com/ansible/django-ansible-base.git --branch stable-2.5
    - mkdir -p /opt/aap_gateway
    - tox d -e py311 /opt/aap_gateway/venv

.collection_test_before_script_template:
  variables:
    POSTGRESQL_DATABASE: gateway
    POSTGRESQL_USER: gateway
    POSTGRESQL_PASSWORD: gateway
    ADMIN_PASSWORD: admin
    DJANGO_SUPERUSER_USERNAME: admin
    DJANGO_SUPERUSER_PASSWORD: admin
    DJANGO_SETTINGS_MODULE: aap_gateway_api.settings
    DATABASE_NAME: gateway
    DATABASE_USER: gateway
    DATABASE_PASSWORD: gateway
    DATABASE_HOST: db
    GATEWAY_SECRET_KEY_FILE: tools/configs/dev_secret_key
    GATEWAY_MANAGE: ./tools/scripts/aap-gateway-manage
    # Need to change runserver command if changing this
    GATEWAY_HOST: 'http://localhost:8000'
  services:
    - name: quay.io/sclorg/postgresql-15-c9s
      alias: db
      entrypoint: ["run-postgresql"]
  script:
  before_script:
    - !reference [".unit_testing_before_script_template", "before_script"]
    # Create all directories we will need (/opt/aap_gateway gets created in the referenced .unit_testing_before_script_template)
    - mkdir -p /var/run/uwsgi
    - mkdir -p /var/log/nginx
    - mkdir -p /etc/ansible-automation-platform/gateway
    - mkdir -p /var/run/supervisor
    - cp -r . /opt/aap_gateway/src
    - cd /opt/aap_gateway/src
    # Generate venv, install ansible (to get ansible-test)
    - dnf module install -y nginx:1.22/common
    - dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
    - dnf install -y inotify-tools libpq postgresql procps socat supervisor
    - source /opt/aap_gateway/venv/bin/activate
    - pip install -r requirements/requirements.txt ansible ansible-core
    # Generate sources needed
    - mkdir -p tools/generated
    - make tools/generated/sources
    - make tools/generated/gateway.crt
    # The below is usually handled by docker-compose and the gateway Dockerfile
    # Copy over files normally mounted via docker-compose, and those done in Dockerfile.j2
    - cp tools/configs/nginx.conf /etc/ansible-automation-platform/gateway/nginx.conf
    - cp tools/configs/nginx-gateway.conf /etc/ansible-automation-platform/gateway/nginx-gateway.conf
    - cp tools/generated/gateway.crt /etc/ansible-automation-platform/gateway/gateway.crt
    - cp tools/generated/gateway.key /etc/ansible-automation-platform/gateway/gateway.key
    - cp tools/configs/uwsgi.ini /etc/ansible-automation-platform/gateway/uwsgi.ini
    - cp tools/configs/settings.py /etc/ansible-automation-platform/gateway/settings.py
    - cp tools/configs/supervisord.conf /etc/supervisord.conf
    - cp tools/scripts/auto-reload /usr/bin/auto-reload
    - cp tools/scripts/aap-gateway-manage /usr/bin/aap-gateway-manage
    - cp tools/configs/nginx.conf /etc/ansible-automation-platform/gateway/nginx.conf
    - cp tools/configs/nginx-gateway.conf /etc/ansible-automation-platform/gateway/nginx-gateway.conf
    - cp tools/configs/uwsgi.ini /etc/ansible-automation-platform/gateway/uwsgi.ini
    - cp tools/configs/settings.py /etc/ansible-automation-platform/gateway/settings.py
    # Run launch-gateway steps (since we're copying everything, we can just call launch-gateway in the background though)
    - ${GATEWAY_MANAGE} migrate --noinput
    - ${GATEWAY_MANAGE} collectstatic --noinput
    - ${GATEWAY_MANAGE} createsuperuser --noinput --username=$DJANGO_SUPERUSER_USERNAME --email=admin@localhost 2> /dev/null
    - ${GATEWAY_MANAGE} authenticators --initialize
    # Start gateway, wait for startup.
    - supervisord -c /etc/supervisord.conf --user root &
    - sleep 5

