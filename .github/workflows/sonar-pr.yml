# SonarCloud Analysis Workflow
#
# This workflow performs SonarCloud analysis after the Unit Tests workflow finishes.
# It is not executed by Unit Tests — GitHub's workflow_run event independently triggers
# this workflow once Unit Tests completes, regardless of its outcome. The gate job
# then filters on success, branch eligibility, and token availability.
#
# FLOW: Unit Tests finishes → GitHub fires workflow_run event → this workflow starts →
#       gate job checks prerequisites → appropriate analysis job runs
#
# CONFIGURATION (via repository variables):
#   SONAR_BRANCHES:          Comma-separated list of branch patterns to enable scanning for.
#                            Supports fnmatch-style wildcards (e.g. "devel,stable-*").
#                            If unset or empty, scanning is disabled for the repository.
#   SONAR_TOKEN_SECRET_NAME: Name of the repository secret that holds the SonarCloud token.
#
# FORK SAFETY:
#   Forks inherit this workflow file but will not have SONAR_BRANCHES or
#   SONAR_TOKEN_SECRET_NAME configured. The gate job requires both variables
#   to be non-empty before any analysis runs. This prevents the workflow from
#   running (and failing) in forks that lack SonarCloud credentials.
#
# JOB 1: gate (prerequisite check)
# - Verifies: Unit Tests succeeded, SONAR_BRANCHES is set, SONAR_TOKEN_SECRET_NAME is set,
#   and the triggering branch matches a configured pattern
# - All analysis jobs depend on this gate passing
#
# JOB 2: sonar-pr-analysis (for PRs)
# - Runs when: Unit Tests finished after a pull_request event
# - Steps: Download coverage → Get PR info → Verify base branch is in SONAR_BRANCHES →
#          Run SonarCloud PR analysis
# - Scans: Full codebase (quality gate evaluates new code vs devel)
#
# JOB 3: sonar-branch-analysis (for long-lived branches)
# - Runs when: Unit Tests finished after a push to a matched branch
# - Skips: merge_group events (PR analysis already ran; merge queue branches
#          compare against devel and flag pre-existing issues as "new")
# - Steps: Download coverage → Run SonarCloud branch analysis
# - Scans: Full codebase
# - Quality gate: Focuses on overall project health
#
# Coverage data produced by Unit Tests is downloaded as artifacts before analysis runs.
#
# What files are scanned:
# - Full codebase on both PR and branch analysis
# - Excludes: tests, scripts, dev environments, build artifacts (see sonar-project.properties)
# - Quality gate on PRs evaluates "new code" (diff from sonar.newCode.referenceBranch)


# With much help from:
# https://community.sonarsource.com/t/how-to-use-sonarcloud-with-a-forked-repository-on-github/7363/30
# https://community.sonarsource.com/t/how-to-use-sonarcloud-with-a-forked-repository-on-github/7363/32
name: SonarCloud
on:
  workflow_run:   # Fires when the Unit Tests workflow finishes (success or failure).
    workflows:
      - Unit Tests
    types:
      - completed

jobs:
  gate:
    name: Check branch eligibility
    runs-on: ubuntu-latest
    # Both variables must be set for scanning to proceed. This also serves as
    # fork protection: forks won't have these variables configured, so the
    # workflow skips cleanly instead of running and failing on missing credentials.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      vars.SONAR_BRANCHES != '' &&
      vars.SONAR_TOKEN_SECRET_NAME != ''
    outputs:
      branch: ${{ steps.check.outputs.branch }}
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check branch against SONAR_BRANCHES
        id: check
        env:
          SONAR_BRANCHES: ${{ vars.SONAR_BRANCHES }}
          EVENT_TYPE: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_TYPE" = "merge_group" ]; then
            # Merge queue branches are ephemeral (gh-readonly-queue/<base>/<sha>).
            # SonarCloud branch analysis compares against sonar.newCode.referenceBranch
            # (devel), but the merge queue branch diverges from a stable-* branch, so
            # the diff is massive and flags dozens of pre-existing issues as "new".
            # The PR already passed SonarCloud PR analysis before entering the queue,
            # so skipping here avoids false quality-gate failures.
            echo "branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ merge_group event — skipping SonarCloud (PR analysis already ran)"
            exit 0
          fi

          if [ "$EVENT_TYPE" = "pull_request" ]; then
            # workflow_run doesn't expose the PR base branch, so we can't check it here.
            # Allow PRs through the gate; the PR analysis job resolves the base branch
            # via the GitHub API and rechecks it against SONAR_BRANCHES before scanning.
            echo "branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "✅ $EVENT_TYPE event — allowing through gate"
            exit 0
          fi

          branch="$HEAD_BRANCH"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          IFS=',' read -ra patterns <<< "$SONAR_BRANCHES"
          for pattern in "${patterns[@]}"; do
            pattern=$(echo "$pattern" | xargs)
            # shellcheck disable=SC2254
            case "$branch" in
              $pattern)
                echo "allowed=true" >> "$GITHUB_OUTPUT"
                echo "✅ Branch '$branch' matches pattern '$pattern'"
                exit 0
                ;;
            esac
          done

          echo "allowed=false" >> "$GITHUB_OUTPUT"
          echo "⏭️ Branch '$branch' does not match any pattern in SONAR_BRANCHES: $SONAR_BRANCHES"

  sonar-pr-analysis:
    name: SonarCloud PR Analysis
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: |
      needs.gate.outputs.allowed == 'true' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      # Pin to the exact commit that the Unit Tests workflow ran against,
      # since workflow_run context defaults to the repo's default branch.
      #
      # allow-unsafe-pr-checkout: required since actions/checkout v4.2+
      # (backported from v7 on 2026-07-16) refuses to check out fork PR
      # code in workflow_run contexts by default. Safe here because this
      # workflow only reads source for static analysis — no fork code is
      # executed.
      # SONAR githubactions:S7631 - safe: workflow only reads source for static analysis, no fork code is executed, permissions are read-only
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      # Download all individual coverage artifacts from Unit Tests workflow
      - name: Download coverage artifacts
        uses: dawidd6/action-download-artifact@246dbf436b23d7c49e21a7ab8204ca9ecd1fe615
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: Unit Tests
          run_id: ${{ github.event.workflow_run.id }}
          pattern: coverage-*

      # Extract PR metadata from workflow_run event and verify the PR targets
      # a branch listed in SONAR_BRANCHES. If the base branch doesn't match,
      # the step sets run_analysis=false and subsequent steps are skipped.
      - name: Set PR metadata and prepare for analysis
        id: metadata
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO_NAME: ${{ github.event.repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_BRANCHES: ${{ vars.SONAR_BRANCHES }}
        run: |
          # Find all downloaded coverage XML files
          coverage_files=$(find . -name "coverage-*.xml" -type f | tr '\n' ',' | sed 's/,$//')
          echo "Found coverage files: $coverage_files"
          echo "COVERAGE_PATHS=$coverage_files" >> $GITHUB_ENV

          # Extract PR number from first coverage.xml file found
          first_coverage=$(find . -name "coverage-*.xml" -type f | head -1)
          if [ -f "$first_coverage" ]; then
            PR_NUMBER=$(grep -m 1 '<!-- PR' "$first_coverage" | awk '{print $3}' || echo "")
            if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              PR_NUMBER=""
            fi
          else
            PR_NUMBER=""
          fi

          echo "🔍 SonarCloud Analysis Decision Summary"
          echo "========================================"
          echo "├── CI Event: ✅ Pull Request"
          echo "├── PR Number from coverage.xml: #${PR_NUMBER:-<not found>}"

          if [ -z "$PR_NUMBER" ]; then
            echo "##[error]❌ FATAL: PR number not found in coverage.xml"
            echo "##[error]This job requires a PR number to run PR analysis."
            echo "##[error]The unit-tests workflow should have injected the PR number into coverage.xml."
            exit 1
          fi

          # Get PR metadata from GitHub API
          if ! PR_DATA=$(gh api "repos/$REPO_NAME/pulls/$PR_NUMBER" 2>&1); then
            echo "::error::Failed to fetch PR #$PR_NUMBER metadata from repos/$REPO_NAME/pulls/$PR_NUMBER"
            echo "::error::gh api output: $PR_DATA"
            exit 1
          fi
          PR_BASE=$(echo "$PR_DATA" | jq -r '.base.ref // empty')
          PR_HEAD=$(echo "$PR_DATA" | jq -r '.head.ref // empty')
          if [ -z "$PR_BASE" ] || [ -z "$PR_HEAD" ]; then
            echo "::error::Could not extract base/head branch from PR #$PR_NUMBER (base='$PR_BASE', head='$PR_HEAD')"
            exit 1
          fi

          # Verify the PR base branch is in SONAR_BRANCHES before proceeding
          base_allowed=false
          IFS=',' read -ra patterns <<< "$SONAR_BRANCHES"
          for pattern in "${patterns[@]}"; do
            pattern=$(echo "$pattern" | xargs)
            # shellcheck disable=SC2254
            case "$PR_BASE" in
              $pattern)
                base_allowed=true
                break
                ;;
            esac
          done

          if [ "$base_allowed" = "false" ]; then
            echo "⏭️ PR base branch '$PR_BASE' does not match any pattern in SONAR_BRANCHES: $SONAR_BRANCHES"
            echo "⏭️ Skipping SonarCloud analysis for this PR."
            echo "run_analysis=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run_analysis=true" >> "$GITHUB_OUTPUT"

          # Print summary
          echo "🔍 SonarCloud Analysis Decision Summary"
          echo "========================================"
          echo "├── CI Event: ✅ Pull Request"
          echo "├── PR Number: #$PR_NUMBER"
          echo "├── Base Branch: $PR_BASE (✅ matches SONAR_BRANCHES)"
          echo "├── Head Branch: $PR_HEAD"
          echo "├── Repo: $REPO_NAME"

          # Export to GitHub env for later steps
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "PR_BASE=$PR_BASE" >> $GITHUB_ENV
          echo "PR_HEAD=$PR_HEAD" >> $GITHUB_ENV
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV

          echo "└── Result: ✅ Running full codebase SonarCloud analysis"

      - name: Extract repo owner and name
        if: steps.metadata.outputs.run_analysis == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.repository.fork }}" = "true" ]; then
            PARENT_REPO_SLUG=$(gh api repos/${{ github.repository }} | jq -r '.parent.full_name // empty')
            if [ -z "$PARENT_REPO_SLUG" ]; then
              echo "::error::Failed to resolve parent repository for fork ${{ github.repository }}"
              exit 1
            fi
            IFS="/" read -r REPO_OWNER REPO_NAME <<< "$PARENT_REPO_SLUG"
          else
            IFS="/" read -r REPO_OWNER REPO_NAME <<< "${GITHUB_REPOSITORY}"
          fi
          if [ -z "$REPO_OWNER" ] || [ -z "$REPO_NAME" ]; then
            echo "::error::Failed to parse repo owner/name (owner='$REPO_OWNER', name='$REPO_NAME')"
            exit 1
          fi
          echo "REPO_OWNER=$REPO_OWNER" >> $GITHUB_ENV
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV

      - name: Verify SONAR_TOKEN is set
        if: steps.metadata.outputs.run_analysis == 'true'
        run: test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN is empty — check vars.SONAR_TOKEN_SECRET_NAME"; exit 1; }
        env:
          SONAR_TOKEN: ${{ secrets[format('{0}', vars.SONAR_TOKEN_SECRET_NAME)] }}

      - name: SonarCloud Scan
        if: steps.metadata.outputs.run_analysis == 'true'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets[format('{0}', vars.SONAR_TOKEN_SECRET_NAME)] }}
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        with:
          args: >
            -Dsonar.projectKey=${{ env.REPO_OWNER }}_${{ env.REPO_NAME }}
            -Dsonar.organization=${{ env.REPO_OWNER }}
            -Dsonar.scm.revision=${{ env.COMMIT_SHA }}
            -Dsonar.pullrequest.key=${{ env.PR_NUMBER }}
            -Dsonar.pullrequest.branch=${{ env.PR_HEAD }}
            -Dsonar.pullrequest.base=${{ env.PR_BASE }}
            -Dsonar.python.coverage.reportPaths=${{ env.COVERAGE_PATHS }}
            -Dsonar.qualitygate.wait=true

  sonar-branch-analysis:
    name: SonarCloud Branch Analysis
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      actions: read
    if: |
      needs.gate.outputs.allowed == 'true' &&
      github.event.workflow_run.event == 'push'
    steps:
      # Pin to the exact commit that the Unit Tests workflow ran against,
      # since workflow_run context defaults to the repo's default branch.
      #
      # SONAR githubactions:S7631 - safe: this job only runs for push events, which come from repo collaborators, never from forks
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Download all individual coverage artifacts from Unit Tests workflow (optional for branch pushes)
      - name: Download coverage artifacts
        continue-on-error: true
        uses: dawidd6/action-download-artifact@246dbf436b23d7c49e21a7ab8204ca9ecd1fe615
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: Unit Tests
          run_id: ${{ github.event.workflow_run.id }}
          pattern: coverage-*

      - name: Print SonarCloud Analysis Summary
        env:
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
          EVENT_TYPE: ${{ github.event.workflow_run.event }}
        run: |
          # Find all downloaded coverage XML files
          coverage_files=$(find . -name "coverage-*.xml" -type f | tr '\n' ',' | sed 's/,$//')
          echo "Found coverage files: $coverage_files"
          echo "COVERAGE_PATHS=$coverage_files" >> $GITHUB_ENV

          echo "🔍 SonarCloud Analysis Summary"
          echo "=============================="
          echo "├── CI Event: ✅ $EVENT_TYPE (via workflow_run)"
          echo "├── Branch: $BRANCH_NAME"
          echo "├── Coverage Files: ${coverage_files:-none}"
          echo "├── Python Changes: ➖ N/A (Full codebase scan)"
          echo "└── Result: ✅ Proceed - \"Running SonarCloud analysis\""

      - name: Extract repo owner and name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.repository.fork }}" = "true" ]; then
            PARENT_REPO_SLUG=$(gh api repos/${{ github.repository }} | jq -r '.parent.full_name // empty')
            if [ -z "$PARENT_REPO_SLUG" ]; then
              echo "::error::Failed to resolve parent repository for fork ${{ github.repository }}"
              exit 1
            fi
            IFS="/" read -r REPO_OWNER REPO_NAME <<< "$PARENT_REPO_SLUG"
          else
            IFS="/" read -r REPO_OWNER REPO_NAME <<< "${GITHUB_REPOSITORY}"
          fi
          if [ -z "$REPO_OWNER" ] || [ -z "$REPO_NAME" ]; then
            echo "::error::Failed to parse repo owner/name (owner='$REPO_OWNER', name='$REPO_NAME')"
            exit 1
          fi
          echo "REPO_OWNER=$REPO_OWNER" >> $GITHUB_ENV
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV

      - name: Verify SONAR_TOKEN is set
        run: test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN is empty — check vars.SONAR_TOKEN_SECRET_NAME"; exit 1; }
        env:
          SONAR_TOKEN: ${{ secrets[format('{0}', vars.SONAR_TOKEN_SECRET_NAME)] }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets[format('{0}', vars.SONAR_TOKEN_SECRET_NAME)] }}
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          # Pass user-controlled workflow_run data through environment variables
          SCM_REVISION: ${{ github.event.workflow_run.head_sha }}
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.REPO_OWNER }}_${{ env.REPO_NAME }}
            -Dsonar.organization=${{ env.REPO_OWNER }}
            -Dsonar.scm.revision=${{ env.SCM_REVISION }}
            -Dsonar.branch.name=${{ env.BRANCH_NAME }}
            ${{ env.COVERAGE_PATHS && format('-Dsonar.python.coverage.reportPaths={0}', env.COVERAGE_PATHS) || '' }}
