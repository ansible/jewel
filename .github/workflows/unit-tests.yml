---
name: Unit Tests
on:
  pull_request:
  push:    # This is triggered on a PR being merged into devel or a stable branch
    branches:
      - devel
      - 'stable-*'
env:
  # Only upload JUnit xml files if we are this repo:
  TARGET_REPOSITORY: 'ansible-automation-platform/aap-gateway'
jobs:
  unit-test:
    name: ${{ matrix.batch.name }}
    runs-on: ubuntu-latest
    if: github.repository == 'ansible-automation-platform/aap-gateway' || github.repository == 'ansible-automation-platform/aap-gateway-debug'
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    permissions:
      packages: write
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        batch:
          - name: "Service-dependent tests"
            python-version: "3.11"
            processes: 1  # this is required to be single threaded because the mock service can't do parallelization at this time
            test-filter:
              aap_gateway_api/tests/management/test_migrate_resources.py
              aap_gateway_api/tests/utils/test_crud_resource_in_services.py
            artifact-suffix: "service"
          - name: "Views tests"
            python-version: "3.11"
            processes: auto
            test-filter: aap_gateway_api/tests/views/
            artifact-suffix: "views"
          - name: "Remaining tests"
            python-version: "3.11"
            processes: auto
            test-filter: >-
              aap_gateway_api/tests/
              --ignore=aap_gateway_api/tests/views/
              --ignore=aap_gateway_api/tests/management/test_migrate_resources.py
              --ignore=aap_gateway_api/tests/utils/test_crud_resource_in_services.py
            artifact-suffix: "remaining"
    steps:
      - uses: actions/checkout@v5

      - name: Install build requirements
        run: sudo apt-get update && sudo apt-get install -y libsasl2-dev libldap2-dev libssl-dev libxmlsec1-dev

      - name: Install python ${{ matrix.batch.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.batch.python-version }}

      - name: Install tox
        run: pip${{ matrix.batch.python-version }} install tox tox-docker requests

      - name: Checkout dependencies
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.AAP_PS_DAB_COLLECTION_REPO_READ != '' && secrets.AAP_PS_DAB_COLLECTION_REPO_READ || secrets.GITHUB_TOKEN }}
        run: |
          python tools/scripts/get_pr_checkout.py \
            --always-clone-repos '[ansible-automation-platform|ansible]/django-ansible-base'

      - name: Run tests
        env:
          PYTEST_NUM_PROCESSES: ${{ matrix.batch.processes }}
        run: tox -e py311 -- ${{ matrix.batch.test-filter }} -v --cov=. --cov-report=xml:coverage-${{ matrix.batch.artifact-suffix }}.xml --junit-xml=junit-${{ matrix.batch.artifact-suffix }}.xml

      - name: Inject PR number into coverage file
        if: github.event_name == 'pull_request'
        run: sed -i '2i <!-- PR ${{ github.event.number }} -->' coverage-${{ matrix.batch.artifact-suffix }}.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.batch.artifact-suffix }}
          path: coverage-${{ matrix.batch.artifact-suffix }}.xml

      - name: Upload junit artifact
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.batch.artifact-suffix }}
          path: junit-${{ matrix.batch.artifact-suffix }}.xml

  merge-and-upload:
    name: Merge junit and upload results
    runs-on: ubuntu-latest
    needs: unit-test
    if: |
      needs.unit-test.result == 'success' &&
      (github.repository == 'ansible-automation-platform/aap-gateway' || github.repository == 'ansible-automation-platform/aap-gateway-debug')
    steps:
      - uses: actions/checkout@v5

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install merge tools
        run: pip install junitparser

      - name: Download all junit artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          merge-multiple: true

      - name: Merge junit files
        run: |
          python3 -c "
          from junitparser import JUnitXml
          import glob
          import os

          junit_files = glob.glob('junit-*.xml')
          if not junit_files:
              print('No junit files found')
              exit(1)

          # Start with the first file
          merged = JUnitXml.fromfile(junit_files[0])
          print(f'Starting with {junit_files[0]}')

          # Merge remaining files
          for junit_file in junit_files[1:]:
              if os.path.exists(junit_file):
                  print(f'Merging {junit_file}')
                  xml = JUnitXml.fromfile(junit_file)
                  merged += xml

          # Write merged result
          merged.write('aap-gateway-test-results.xml')
          print('Merged junit files successfully')
          "

      - name: Upload final junit as artifact
        uses: actions/upload-artifact@v4
        with:
          name: aap-gateway-test-results
          path: aap-gateway-test-results.xml
