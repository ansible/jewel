---
name: Unit Tests
on:
  pull_request:
  merge_group:
  push:    # This is triggered on a PR being merged into devel or a stable branch
    branches:
      - devel
      

env:
  # Only upload JUnit xml files if we are this repo:
  TARGET_REPOSITORY: 'ansible/jewel'
jobs:
  unit-test:
    name: ${{ matrix.batch.name }}
    runs-on: ubuntu-latest
    container:
      image: quay.io/ansible/jewel-ci:${{ github.base_ref || github.ref_name }}
    env:
      TOX_DOCKER_GATEWAY: "0.0.0.0"
    if: github.repository == 'ansible/jewel' || github.repository == 'ansible/jewel-debug'
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      db:
        image: quay.io/sclorg/postgresql-15-c9s
        env:
          POSTGRESQL_PASSWORD: password
          POSTGRESQL_ADMIN_PASSWORD: password
          POSTGRESQL_USER: gw
          POSTGRESQL_DATABASE: gw_db
        ports:
          - 5432:5432
    permissions:
      packages: write
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        batch:
          # Views are split alphabetically by v1/ subdirectory name so both
          # halves stay roughly balanced as new test dirs are added.  Anything
          # under views/ that is NOT under views/api/v1/ (envoy, root-level
          # test files, future api versions) falls into the "Non-views" batch.
          - name: "Views A-R"
            python-version: "3.12"
            processes: auto
            test-filter: >-
              aap_gateway_api/tests/views/api/v1/[a-r]*/
              aap_gateway_api/tests/views/api/v1/test_gateway_v1.py
              aap_gateway_api/tests/views/api/v1/test_jwt_claims.py
            artifact-suffix: "views-ar"
          - name: "Views S-Z"
            python-version: "3.12"
            processes: auto
            test-filter: >-
              aap_gateway_api/tests/views/api/v1/[s-z]*/
            artifact-suffix: "views-sz"
          - name: "Non-views"
            python-version: "3.12"
            processes: auto
            test-filter: >-
              aap_gateway_api/tests/
              --ignore-glob=aap_gateway_api/tests/views/api/v1/*/
              --ignore=aap_gateway_api/tests/management/commands/_migrate_service_data/
              --ignore=aap_gateway_api/tests/management/commands/test_migrate_service_data.py
              --ignore=aap_gateway_api/tests/utils/test_crud_resource_in_services.py
            artifact-suffix: "remaining"
          - name: "Service tests"
            python-version: "3.12"
            processes: auto
            test-filter: >-
              aap_gateway_api/tests/management/commands/_migrate_service_data/
              aap_gateway_api/tests/management/commands/test_migrate_service_data.py
              aap_gateway_api/tests/utils/test_crud_resource_in_services.py
            artifact-suffix: "services"
    steps:
      - uses: actions/checkout@v5

      - name: Checkout dependencies
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN != '' && secrets.GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python tools/scripts/get_pr_checkout.py \
            --always-clone-repos 'ansible/django-ansible-base'

      - name: Set tox environment name
        id: tox-env
        run: |
          echo "name=py312" >> "$GITHUB_OUTPUT"

      - name: Link pre-seeded tox cache
        run: ln -s /opt/tox-cache .tox

      - name: Create tox environment
        env:
          GATEWAY_TEST_DIRS: ""
        run: |
          tox -e ${{ steps.tox-env.outputs.name }} \
            -x testenv:${{ steps.tox-env.outputs.name }}.docker= \
            -- --collect-only aap_gateway_api/tests/__init__.py

      - name: Run tests
        env:
          PYTEST_NUM_PROCESSES: ${{ matrix.batch.processes }}
          GATEWAY_TEST_DIRS: ""
          ANSIBLE_GW_TEST_DB_HOST: db
          DB_PORT: 5432
        run: |
          tox -e ${{ steps.tox-env.outputs.name }} \
            -x testenv:${{ steps.tox-env.outputs.name }}.docker= \
            -- ${{ matrix.batch.test-filter }} -v \
            -m "not perf" \
            --cov=. --cov-report=xml:coverage-${{ matrix.batch.artifact-suffix }}.xml \
            --junit-xml=junit-${{ matrix.batch.artifact-suffix }}.xml

      - name: Set artifact suffix
        id: artifact
        run: |
          echo "suffix=${{ matrix.batch.artifact-suffix }}" >> "$GITHUB_OUTPUT"

      - name: Inject PR number into coverage file
        if: github.event_name == 'pull_request'
        run: sed -i '2i <!-- PR ${{ github.event.number }} -->' coverage-${{ steps.artifact.outputs.suffix }}.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ steps.artifact.outputs.suffix }}
          path: coverage-${{ steps.artifact.outputs.suffix }}.xml

      - name: Upload junit artifact
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ steps.artifact.outputs.suffix }}
          path: junit-${{ steps.artifact.outputs.suffix }}.xml

  merge-and-upload:
    name: Merge junit and upload results
    runs-on: ubuntu-latest
    container:
      image: quay.io/ansible/jewel-ci:${{ github.base_ref || github.ref_name }}
    needs: unit-test
    # Run even if some jobs failed, but only if at least one job completed
    if: |
      always() &&
      (needs.unit-test.result == 'success' || needs.unit-test.result == 'failure') &&
      (github.repository == 'ansible/jewel' || github.repository == 'ansible/jewel-debug')
    steps:
      - uses: actions/checkout@v5

      - name: Install merge tools
        run: pip install junitparser

      - name: Download all junit artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          merge-multiple: true

      - name: Merge junit files
        run: |
          python3 -c "
          from junitparser import JUnitXml
          import glob
          import os

          junit_files = glob.glob('junit-*.xml')
          if not junit_files:
              print('No junit files found')
              exit(1)

          # Start with the first file
          merged = JUnitXml.fromfile(junit_files[0])
          print(f'Starting with {junit_files[0]}')

          # Merge remaining files
          for junit_file in junit_files[1:]:
              if os.path.exists(junit_file):
                  print(f'Merging {junit_file}')
                  xml = JUnitXml.fromfile(junit_file)
                  merged += xml

          # Write merged result
          merged.write('aap-gateway-test-results.xml')
          print('Merged junit files successfully')
          "

      - name: Upload final junit as artifact
        uses: actions/upload-artifact@v4
        with:
          name: aap-gateway-test-results
          path: aap-gateway-test-results.xml
