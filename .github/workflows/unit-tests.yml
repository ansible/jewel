---
name: Unit Tests
on:
  pull_request:
  push:    # This is triggered on a PR being merged into devel or a stable branch
    branches:
      - devel
      - 'stable-*'

env:
  # Only upload JUnit xml files if we are this repo:
  TARGET_REPOSITORY: 'ansible-automation-platform/aap-gateway'
jobs:
  unit-test:
    name: ${{ matrix.batch.name }}
    runs-on: ubuntu-24.04
    # Using ubuntu-24.04 because it has docker engine 28.0.4(first link) that uses docker API version 1.51.
    # The tox docker plugin needs docker API 1.51 or older, otherwise it will fail because API 1.52 removed the
    # gateway (networking gateway) IP address from network settings of the container(its in different location).
    # There is a PR to fix the issue(second link) but until its merged, we need to stick with specific docker version.
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#tools
    # https://github.com/tox-dev/tox-docker/pull/196
    if: github.repository == 'ansible-automation-platform/aap-gateway' || github.repository == 'ansible-automation-platform/aap-gateway-debug'
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    permissions:
      packages: write
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        batch:
          - name: "Service-dependent tests"
            python-version: "3.12"
            processes: 1  # this is required to be single threaded because the mock service can't do parallelization at this time
            test-filter:
              aap_gateway_api/tests/management/test_migrate_resources.py
              aap_gateway_api/tests/utils/test_crud_resource_in_services.py
            artifact-suffix: "service"
          - name: "Views tests"
            python-version: "3.12"
            processes: auto
            test-filter: aap_gateway_api/tests/views/
            artifact-suffix: "views"
          - name: "Remaining tests"
            python-version: "3.12"
            processes: auto
            test-filter: >-
              aap_gateway_api/tests/
              --ignore=aap_gateway_api/tests/views/
              --ignore=aap_gateway_api/tests/management/test_migrate_resources.py
              --ignore=aap_gateway_api/tests/utils/test_crud_resource_in_services.py
            artifact-suffix: "remaining"
    steps:
      - uses: actions/checkout@v5

      - name: Install build requirements
        run: sudo apt-get update && sudo apt-get install -y libsasl2-dev libldap2-dev libssl-dev libxmlsec1-dev

      - name: Install python ${{ matrix.batch.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.batch.python-version }}

      - name: Install tox
        run: pip${{ matrix.batch.python-version }} install tox tox-docker requests

      - name: Checkout dependencies
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.AAP_PS_DAB_COLLECTION_REPO_READ != '' && secrets.AAP_PS_DAB_COLLECTION_REPO_READ || secrets.GITHUB_TOKEN }}
        run: |
          python tools/scripts/get_pr_checkout.py \
            --always-clone-repos '[ansible-automation-platform|ansible]/django-ansible-base'

      - name: Create tox environment and run setup
        # We use --collect-only instead of --notest because:
        # 1. The tox-reinstall-django-ansible-base.sh script runs as part of tox commands
        # 2. This script may reinstall DAB with different lxml/xmlsec versions
        # 3. We need those final versions before rebuilding from source
        #
        # Optimizations to make this fast:
        # -x testenv:py312.docker=  : Override docker config to empty, skipping DB container startup
        # --collect-only            : pytest only discovers tests, doesn't run them
        # aap_gateway_api/tests/__init__.py : Collect just this one (empty) file for speed
        run: |
          tox -e py312 \
            -x testenv:py312.docker= \
            -- --collect-only aap_gateway_api/tests/__init__.py

      - name: Rebuild lxml and xmlsec from source
        # Workaround for https://github.com/xmlsec/python-xmlsec/issues/320
        # The pip wheels are compiled against a different libxml2 than the system has,
        # causing "lxml & xmlsec libxml2 library version mismatch" errors.
        # Using --no-binary forces pip to build from source against system libxml2.
        run: |
          XMLSEC_VERSION=$(.tox/py312/bin/pip freeze | grep xmlsec | sed 's:^.*=::')
          LXML_VERSION=$(.tox/py312/bin/pip freeze | grep lxml | sed 's:^.*=::')

          echo "Rebuilding xmlsec==${XMLSEC_VERSION} and lxml==${LXML_VERSION} from source"

          .tox/py312/bin/pip install --no-cache-dir --no-binary lxml,xmlsec --force-reinstall \
              lxml==${LXML_VERSION} xmlsec==${XMLSEC_VERSION}

      - name: Run tests
        env:
          PYTEST_NUM_PROCESSES: ${{ matrix.batch.processes }}
        run: tox -e py312 -- ${{ matrix.batch.test-filter }} -v --cov=. --cov-report=xml:coverage-${{ matrix.batch.artifact-suffix }}.xml --junit-xml=junit-${{ matrix.batch.artifact-suffix }}.xml

      - name: Inject PR number into coverage file
        if: github.event_name == 'pull_request'
        run: sed -i '2i <!-- PR ${{ github.event.number }} -->' coverage-${{ matrix.batch.artifact-suffix }}.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.batch.artifact-suffix }}
          path: coverage-${{ matrix.batch.artifact-suffix }}.xml

      - name: Upload junit artifact
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.batch.artifact-suffix }}
          path: junit-${{ matrix.batch.artifact-suffix }}.xml

  merge-and-upload:
    name: Merge junit and upload results
    runs-on: ubuntu-latest
    needs: unit-test
    if: |
      needs.unit-test.result == 'success' &&
      (github.repository == 'ansible-automation-platform/aap-gateway' || github.repository == 'ansible-automation-platform/aap-gateway-debug')
    steps:
      - uses: actions/checkout@v5

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install merge tools
        run: pip install junitparser

      - name: Download all junit artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          merge-multiple: true

      - name: Merge junit files
        run: |
          python3 -c "
          from junitparser import JUnitXml
          import glob
          import os

          junit_files = glob.glob('junit-*.xml')
          if not junit_files:
              print('No junit files found')
              exit(1)

          # Start with the first file
          merged = JUnitXml.fromfile(junit_files[0])
          print(f'Starting with {junit_files[0]}')

          # Merge remaining files
          for junit_file in junit_files[1:]:
              if os.path.exists(junit_file):
                  print(f'Merging {junit_file}')
                  xml = JUnitXml.fromfile(junit_file)
                  merged += xml

          # Write merged result
          merged.write('aap-gateway-test-results.xml')
          print('Merged junit files successfully')
          "

      - name: Upload final junit as artifact
        uses: actions/upload-artifact@v4
        with:
          name: aap-gateway-test-results
          path: aap-gateway-test-results.xml
