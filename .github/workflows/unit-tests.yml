---
name: Unit Tests
on:
  pull_request:
  push:    # This is triggered on a PR being merged into devel or a stable branch
    branches:
      - devel
      

env:
  # Only upload JUnit xml files if we are this repo:
  TARGET_REPOSITORY: 'ansible/jewel'
jobs:
  unit-test:
    name: ${{ matrix.batch.name }} (Django ${{ matrix.django-version }})
    runs-on: ubuntu-24.04
    env:
      # Avoid KeyError: 'Gateway' with Docker API 1.52+ (tox-docker expects NetworkSettings.Gateway).
      # See https://github.com/tox-dev/tox-docker/pull/196 and django-ansible-base PR 938.
      TOX_DOCKER_GATEWAY: "0.0.0.0"
    # Using ubuntu-24.04 because it has docker engine 28.0.4(first link) that uses docker API version 1.51.
    # The tox docker plugin needs docker API 1.51 or older, otherwise it will fail because API 1.52 removed the
    # gateway (networking gateway) IP address from network settings of the container(its in different location).
    # There is a PR to fix the issue(second link) but until its merged, we need to stick with specific docker version.
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#tools
    # https://github.com/tox-dev/tox-docker/pull/196
    if: github.repository == 'ansible/jewel' || github.repository == 'ansible/jewel-debug'
    # Django 4.2 tests are informational only on devel (for backport compatibility checking)
    # Django 5.2 tests must always pass - this is the production version for devel
    # On stable-* branches, BOTH Django versions must pass (production uses 4.2 there)
    continue-on-error: ${{ matrix.django-version == '4.2' && (github.base_ref == 'devel' || (github.event_name == 'push' && github.ref_name == 'devel')) }}
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    permissions:
      packages: write
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        django-version: ["4.2", "5.2"]
        batch:
          # Views are split alphabetically by v1/ subdirectory name so both
          # halves stay roughly balanced as new test dirs are added.  Anything
          # under views/ that is NOT under views/api/v1/ (envoy, root-level
          # test files, future api versions) falls into the "Non-views" batch.
          - name: "Views A-R"
            python-version: "3.12"
            processes: auto
            test-filter: >-
              aap_gateway_api/tests/views/api/v1/[a-r]*/
            artifact-suffix: "views-ar"
          - name: "Views S-Z"
            python-version: "3.12"
            processes: auto
            test-filter: >-
              aap_gateway_api/tests/views/api/v1/[s-z]*/
            artifact-suffix: "views-sz"
          - name: "Non-views"
            python-version: "3.12"
            processes: auto
            test-filter: >-
              aap_gateway_api/tests/
              --ignore-glob=aap_gateway_api/tests/views/api/v1/*/
              --ignore=aap_gateway_api/tests/management/test_migrate_resources.py
              --ignore=aap_gateway_api/tests/utils/test_crud_resource_in_services.py
            artifact-suffix: "remaining"
          - name: "Service tests"
            python-version: "3.12"
            processes: auto
            test-filter: >-
              aap_gateway_api/tests/management/test_migrate_resources.py
              aap_gateway_api/tests/utils/test_crud_resource_in_services.py
            artifact-suffix: "services"
    steps:
      - uses: actions/checkout@v5

      - name: Install build requirements
        run: sudo apt-get update && sudo apt-get install -y libsasl2-dev libldap2-dev libssl-dev libxmlsec1-dev

      - name: Install python ${{ matrix.batch.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.batch.python-version }}

      - name: Install tox
        run: pip${{ matrix.batch.python-version }} install tox tox-docker requests

      - name: Checkout dependencies
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN != '' && secrets.GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python tools/scripts/get_pr_checkout.py \
            --always-clone-repos 'ansible/django-ansible-base'

      # Construct tox environment name based on Django version
      # e.g., py312-django42 or py312-django52
      - name: Set tox environment name
        id: tox-env
        run: |
          DJANGO_VERSION="${{ matrix.django-version }}"
          TOX_ENV="py312-django${DJANGO_VERSION/./}"
          echo "name=${TOX_ENV}" >> $GITHUB_OUTPUT
          echo "Using tox environment: ${TOX_ENV}"

      - name: Create tox environment and run setup
        # We use --collect-only instead of --notest because:
        # 1. The tox-reinstall-django-ansible-base.sh script runs as part of tox commands
        # 2. This script may reinstall DAB with different lxml/xmlsec versions
        # 3. We need those final versions before rebuilding from source
        #
        # Optimizations to make this fast:
        # -x testenv:$TOX_ENV.docker=  : Override docker config to empty, skipping DB container startup
        # --collect-only            : pytest only discovers tests, doesn't run them
        # GATEWAY_TEST_DIRS=""      : Override tox default so only __init__.py is collected
        # aap_gateway_api/tests/__init__.py : Contains a single placeholder test
        env:
          GATEWAY_TEST_DIRS: ""
        run: |
          tox -e ${{ steps.tox-env.outputs.name }} \
            -x testenv:${{ steps.tox-env.outputs.name }}.docker= \
            -- --collect-only aap_gateway_api/tests/__init__.py

      - name: Rebuild lxml and xmlsec from source
        # Workaround for https://github.com/xmlsec/python-xmlsec/issues/320
        # The pip wheels are compiled against a different libxml2 than the system has,
        # causing "lxml & xmlsec libxml2 library version mismatch" errors.
        # Using --no-binary forces pip to build from source against system libxml2.
        run: |
          TOX_ENV="${{ steps.tox-env.outputs.name }}"
          XMLSEC_VERSION=$(.tox/${TOX_ENV}/bin/pip freeze | grep xmlsec | sed 's:^.*=::')
          LXML_VERSION=$(.tox/${TOX_ENV}/bin/pip freeze | grep lxml | sed 's:^.*=::')

          echo "Rebuilding xmlsec==${XMLSEC_VERSION} and lxml==${LXML_VERSION} from source"

          .tox/${TOX_ENV}/bin/pip install --no-cache-dir --no-binary lxml,xmlsec --force-reinstall \
              lxml==${LXML_VERSION} xmlsec==${XMLSEC_VERSION}

      - name: Run tests
        env:
          PYTEST_NUM_PROCESSES: ${{ matrix.batch.processes }}
          GATEWAY_TEST_DIRS: ""
        run: |
          DJANGO_VERSION="${{ matrix.django-version }}"
          ARTIFACT_SUFFIX="${{ matrix.batch.artifact-suffix }}-django${DJANGO_VERSION/./}"
          tox -e ${{ steps.tox-env.outputs.name }} -- ${{ matrix.batch.test-filter }} -v \
            --cov=. --cov-report=xml:coverage-${ARTIFACT_SUFFIX}.xml \
            --junit-xml=junit-${ARTIFACT_SUFFIX}.xml

      - name: Set artifact suffix
        id: artifact
        run: |
          DJANGO_VERSION="${{ matrix.django-version }}"
          echo "suffix=${{ matrix.batch.artifact-suffix }}-django${DJANGO_VERSION/./}" >> $GITHUB_OUTPUT

      - name: Inject PR number into coverage file
        if: github.event_name == 'pull_request'
        run: sed -i '2i <!-- PR ${{ github.event.number }} -->' coverage-${{ steps.artifact.outputs.suffix }}.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ steps.artifact.outputs.suffix }}
          path: coverage-${{ steps.artifact.outputs.suffix }}.xml

      - name: Upload junit artifact
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ steps.artifact.outputs.suffix }}
          path: junit-${{ steps.artifact.outputs.suffix }}.xml

  merge-and-upload:
    name: Merge junit and upload results
    runs-on: ubuntu-latest
    needs: unit-test
    # Run even if some jobs failed (Django 4.2 might fail with continue-on-error)
    # but only if at least one job completed
    if: |
      always() &&
      (needs.unit-test.result == 'success' || needs.unit-test.result == 'failure') &&
      (github.repository == 'ansible/jewel' || github.repository == 'ansible/jewel-debug')
    steps:
      - uses: actions/checkout@v5

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install merge tools
        run: pip install junitparser

      - name: Download all junit artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          merge-multiple: true

      - name: Merge junit files
        run: |
          python3 -c "
          from junitparser import JUnitXml
          import glob
          import os

          junit_files = glob.glob('junit-*.xml')
          if not junit_files:
              print('No junit files found')
              exit(1)

          # Start with the first file
          merged = JUnitXml.fromfile(junit_files[0])
          print(f'Starting with {junit_files[0]}')

          # Merge remaining files
          for junit_file in junit_files[1:]:
              if os.path.exists(junit_file):
                  print(f'Merging {junit_file}')
                  xml = JUnitXml.fromfile(junit_file)
                  merged += xml

          # Write merged result
          merged.write('aap-gateway-test-results.xml')
          print('Merged junit files successfully')
          "

      - name: Upload final junit as artifact
        uses: actions/upload-artifact@v4
        with:
          name: aap-gateway-test-results
          path: aap-gateway-test-results.xml
