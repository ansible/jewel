# ============================================================================
# Manually-Triggered Repo Sync
# ============================================================================
#
# Triggers an immediate sync to downstream via workflow_dispatch (Actions → Run workflow).
#
# Prerequisites (org-level, one-time setup):
#   1. Org secret:   ANSIBLE_CICD_BOT_ORG_RW_TOKEN_PRIVATE_KEY (GitHub App key for target org)
#   2. Org variable: ANSIBLE_CICD_BOT_ORG_RW_TOKEN_APP_ID (GitHub App ID)
#   3. The GitHub App must be installed on the target org
#   4. Org secret:   SYNC_TARGET_ORG  (target GitHub org name)
#   5. Org secret:   SYNC_TARGET_REPO (target repository name in that org)
#
# Prerequisites (org-level, GitHub org admin must enable visibility for source repo):
#   1. Org secret:   ANSIBLE_CICD_BOT_ORG_RW_TOKEN_PRIVATE_KEY
#
# ============================================================================

name: "Repo Sync to a foreign GitHub org"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-sync-${{ github.ref }}
  cancel-in-progress: true

# ── Defaults ────────────────────────────────────────────────────────────────
env:
  SOURCE_ORG: "ansible"
  SYNC_TARGET_ORG: ${{ secrets.SYNC_TARGET_ORG }}
  SYNC_TARGET_REPO: ${{ secrets.SYNC_TARGET_REPO }}

jobs:
  sync:
    name: "Sync to downstream"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate secrets
        run: |
          if [ -z "${SYNC_TARGET_ORG}" ] || [ -z "${SYNC_TARGET_REPO}" ]; then
            echo "::error::Required secrets SYNC_TARGET_ORG and/or SYNC_TARGET_REPO are not configured"
            exit 1
          fi

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ vars.ANSIBLE_CICD_BOT_ORG_RW_TOKEN_APP_ID }}
          private-key: ${{ secrets.ANSIBLE_CICD_BOT_ORG_RW_TOKEN_PRIVATE_KEY }}
          owner: ${{ env.SYNC_TARGET_ORG }}
          repositories: ${{ env.SYNC_TARGET_REPO }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: "Sync repository"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "▶ Cloning ${SOURCE_ORG}/${SOURCE_REPO} (branch: ${BRANCH})"
          git clone --single-branch --branch "${BRANCH}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${SOURCE_ORG}/${SOURCE_REPO}.git"
          cd "${SOURCE_REPO}"
          echo "▶ Pushing ${BRANCH} to downstream"
          git push "https://x-access-token:${TARGET_GITHUB_TOKEN}@github.com/${SYNC_TARGET_ORG}/${SYNC_TARGET_REPO}.git" "HEAD:${BRANCH}" > /dev/null 2>&1
          echo "✔ Mirrored ${SOURCE_ORG}/${SOURCE_REPO}:${BRANCH} to downstream"

      - name: Cleanup
        if: always()
        env:
          SOURCE_REPO: ${{ github.event.repository.name }}
        run: rm -rf "${SOURCE_REPO}"
