---
# Sanity checks and dev environment tests for aap-gateway
#
# This workflow runs sanity checks first, then calls dev-environment.yml if sanity passes.
# Sanity checks do not need the collection or dev environment to be running.
# Dev environment tests require the full dev environment with secrets.
#
# FLOW: PR is created → sanity checks run → dev-environment.yml workflow called (if sanity passes)
#
# This ensures the PR is valid before running expensive dev environment tests which require secrets.
#
# Jobs:
# 1. tox - Runs sanity checks (linting, migrations, etc.) - matrix job with 4 test environments
# 2. create-pr-metadata - Creates PR metadata artifact
# 3. call-dev-environment - Calls dev-environment.yml reusable workflow with PR number and SHA
name: Sanity
env:
  LC_ALL: "C.UTF-8" # prevent ERROR: Ansible could not initialize the preferred locale: unsupported locale setting
on:
  pull_request:
jobs:
  tox:
    name: aap_gateway_api - ${{ matrix.tests.env }}
    runs-on: ubuntu-latest
    env:
      # Avoid KeyError: 'Gateway' with Docker API 1.52+ (tox-docker expects NetworkSettings.Gateway).
      # See https://github.com/tox-dev/tox-docker/pull/196 and django-ansible-base PR 938.
      TOX_DOCKER_GATEWAY: "0.0.0.0"
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    permissions:
      packages: write
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        tests:
          - env: check
            python-version: "3.12"
          - env: check-migrations
            python-version: "3.12"
          - env: check-oauth2-permissions
            python-version: "3.12"
          - env: check-help-text
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install build requirements
        run: sudo apt-get update && sudo apt-get install -y libsasl2-dev libldap2-dev libssl-dev libxmlsec1-dev

      - name: Install python ${{ matrix.tests.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.tests.python-version }}

      - name: Install tox
        run: pip${{ matrix.tests.python-version }} install tox tox-docker requests

      - name: Checkout dependencies
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.AAP_PS_DAB_COLLECTION_REPO_READ != '' && secrets.AAP_PS_DAB_COLLECTION_REPO_READ || secrets.GITHUB_TOKEN }}
        run: |
          python tools/scripts/get_pr_checkout.py \
            --always-clone-repos '[ansible-automation-platform|ansible]/django-ansible-base'

      - name: Run tox
        run: tox -e ${{ matrix.tests.env }}

  create-pr-metadata:
    name: Create PR metadata artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Create PR metadata file
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p pr-metadata
          printf '%s\n' "$PR_NUMBER" > pr-metadata/pr-number.txt
          printf '%s\n' "$PR_BODY" > pr-metadata/pr-body.txt
          echo "Created PR metadata for PR #$PR_NUMBER"

      - name: Upload PR metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-metadata
          path: pr-metadata/
          retention-days: 1

  call-dev-environment:
    name: Call dev environment tests
    needs: [tox, create-pr-metadata]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/dev-environment.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      pr_base: ${{ github.event.pull_request.base.ref }}
      pr_head_repo: ${{ github.event.pull_request.head.repo.full_name }}
      pr_body: ${{ github.event.pull_request.body }}
    secrets:
      AAP_PS_DAB_COLLECTION_REPO_READ: ${{ secrets.AAP_PS_DAB_COLLECTION_REPO_READ }}