---
name: Sanity
env:
  LC_ALL: "C.UTF-8" # prevent ERROR: Ansible could not initialize the preferred locale: unsupported locale setting
on:
  pull_request:
  push:
jobs:
  tox:
    name: aap_gateway_api - ${{ matrix.tests.env }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    permissions:
      packages: write
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        tests:
          - env: check
            python-version: "3.11"
          - env: check-migrations
            python-version: "3.11"
          - env: check-oauth2-permissions
            python-version: "3.11"
          - env: check-help-text
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v3

      - name: Install build requirements
        run: sudo apt-get update && sudo apt-get install -y libsasl2-dev libldap2-dev libssl-dev libxmlsec1-dev

      - name: Install python ${{ matrix.tests.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.tests.python-version }}

      - name: Install tox
        run: pip${{ matrix.tests.python-version }} install tox tox-docker requests

      - name: Checkout DAB branch if needed
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/scripts/get_dab_for_pr.py

      - name: Run tox
        run: tox -e ${{ matrix.tests.env }}
