name: Build and Publish Image

on:
  push:
    branches:
      - devel

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ansible/jewel

jobs:
  build-and-push-image:
    if: github.repository == 'ansible/jewel'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Podman
        uses: redhat-actions/podman-install@072203a124c069d8fc8621c1a33f9fa9510ae2e1 # v1.1.1

      - name: Install multi-architecture build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes buildah qemu-user-static

      - name: Generate container build files
        run: |
          python -m pip install --only-binary :all: ansible-core==2.21.1
          make tools/generated/sources

      - name: Log in to the Container registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          short_sha="${COMMIT_SHA:0:7}"
          created=$(date --utc +%Y-%m-%dT%H:%M:%SZ)
          {
            echo 'tags<<EOF'
            echo latest
            echo "sha-${short_sha}"
            echo "sha-${COMMIT_SHA}"
            echo EOF
            echo 'labels<<EOF'
            echo "org.opencontainers.image.created=${created}"
            echo "org.opencontainers.image.revision=${COMMIT_SHA}"
            echo "org.opencontainers.image.source=https://github.com/${REPOSITORY}"
            echo "org.opencontainers.image.url=https://github.com/${REPOSITORY}"
            echo 'org.opencontainers.image.version=latest'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build multi-architecture image
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          context: .
          containerfiles: tools/generated/Containerfile
          image: ${{ env.IMAGE_NAME }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          extra-args: |
            --target
            jewel

      - name: Push multi-architecture image
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.REGISTRY }}
