---
name: Performance Tests
on:
  pull_request:
  push:
    branches:
      - devel

jobs:
  perf-test:
    name: "Performance Tests"
    runs-on: ubuntu-latest
    container:
      image: quay.io/ansible/jewel-ci:${{ github.base_ref || github.ref_name }}
    env:
      TOX_DOCKER_GATEWAY: "0.0.0.0"
    if: github.repository == 'ansible/jewel' || github.repository == 'ansible/jewel-debug'
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      db:
        image: quay.io/sclorg/postgresql-15-c9s
        env:
          POSTGRESQL_PASSWORD: password
          POSTGRESQL_ADMIN_PASSWORD: password
          POSTGRESQL_USER: gw
          POSTGRESQL_DATABASE: gw_db
        ports:
          - 5432:5432
    permissions:
      packages: write
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Checkout dependencies
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN != '' && secrets.GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python tools/scripts/get_pr_checkout.py \
            --always-clone-repos 'ansible/django-ansible-base'

      - name: Set tox environment name
        id: tox-env
        run: |
          echo "name=py312" >> "$GITHUB_OUTPUT"

      - name: Link pre-seeded tox cache
        run: ln -s /opt/tox-cache .tox

      - name: Create tox environment
        env:
          GATEWAY_TEST_DIRS: ""
        run: |
          tox -e ${{ steps.tox-env.outputs.name }} \
            -x testenv:${{ steps.tox-env.outputs.name }}.docker= \
            -- --collect-only aap_gateway_api/tests/__init__.py

      - name: Run performance tests
        env:
          GATEWAY_TEST_DIRS: aap_gateway_api/tests
          ANSIBLE_GW_TEST_DB_HOST: db
          DB_PORT: 5432
        run: |
          tox -e ${{ steps.tox-env.outputs.name }} \
            -x testenv:${{ steps.tox-env.outputs.name }}.docker= \
            -- -m perf -v \
            --junit-xml=junit-perf.xml

      - name: Upload junit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-perf
          path: junit-perf.xml
