# JUnit Upload Workflow for aap-gateway
#
# This workflow is triggered by the Unit Tests workflow completion on the devel branch.
# Test results must be uploaded for each commit merged into the repository's main default branch.
#
# Steps overview:
# 1. Download JUnit results from Unit Tests workflow
# 2. Extract commit and repository information
# 3. Upload JUnit XML test results (production) or show command (debug repo)
#

name: JUnit Upload
on:
  workflow_run:
    workflows:
      - Unit Tests
    types:
      - completed
jobs:
  junit-upload:
    name: Upload JUnit XML test results
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'devel' &&
      (github.repository == 'ansible-automation-platform/aap-gateway' || github.repository == 'ansible-automation-platform/aap-gateway-debug')
    steps:
      # Download JUnit results from workflow_run
      - name: Download results artifact
        uses: dawidd6/action-download-artifact@246dbf436b23d7c49e21a7ab8204ca9ecd1fe615
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: Unit Tests
          run_id: ${{ github.event.workflow_run.id }}
          name: aap-gateway-test-results

      # Set COMMIT_SHA and REPO_NAME from workflow_run
      - name: Set COMMIT_SHA and REPO_NAME
        env:
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_REPO_NAME: ${{ github.event.repository.full_name }}
        run: |
          echo "COMMIT_SHA=$WORKFLOW_RUN_HEAD_SHA" >> $GITHUB_ENV
          echo "REPO_NAME=$WORKFLOW_RUN_REPO_NAME" >> $GITHUB_ENV

      - name: Upload jUnit XML test results (Production)
        if: github.repository == 'ansible-automation-platform/aap-gateway'
        env:
          UPLOAD_USER: ${{ vars.PDE_ORG_RESULTS_AGGREGATOR_UPLOAD_USER }}
          UPLOAD_PASSWORD: ${{ secrets.PDE_ORG_RESULTS_UPLOAD_PASSWORD }}
          UPLOAD_URL: ${{ vars.PDE_ORG_RESULTS_AGGREGATOR_UPLOAD_URL }}
        run: >-
          curl -v --fail-with-body
          --user "${UPLOAD_USER}:${UPLOAD_PASSWORD}"
          --form "xunit_xml=@aap-gateway-test-results.xml"
          --form "component_name=aap-gateway"
          --form "git_commit_sha=${{ env.COMMIT_SHA }}"
          --form "git_repository_url=https://github.com/${{ env.REPO_NAME }}"
          "${UPLOAD_URL}"

      - name: Show upload command (Debug Repository)
        if: github.repository == 'ansible-automation-platform/aap-gateway-debug'
        run: |
          echo "🔍 Debug mode: Would have uploaded test results with the following parameters:"
          echo "  Component: aap-gateway"
          echo "  Commit SHA: ${{ env.COMMIT_SHA }}"
          echo "  Repository: https://github.com/${{ env.REPO_NAME }}"
          echo "  Test Results File: aap-gateway-test-results.xml"
          echo ""
          echo "Command structure (credentials redacted):"
          echo "  curl -v --fail-with-body \\"
          echo "    --user \"<UPLOAD_USER>:<UPLOAD_PASSWORD>\" \\"
          echo "    --form \"xunit_xml=@aap-gateway-test-results.xml\" \\"
          echo "    --form \"component_name=aap-gateway\" \\"
          echo "    --form \"git_commit_sha=${{ env.COMMIT_SHA }}\" \\"
          echo "    --form \"git_repository_url=https://github.com/${{ env.REPO_NAME }}\" \\"
          echo "    \"<UPLOAD_URL>\""
