---
name: DVCS (Find Jira Key)
on:
  pull_request:
jobs:
  dvcs_pr_checker:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    name: Check the PR for DVCS integration
    steps:
      - uses: ansible/dvcs-action@b213b07695078ef60390f9b2b2df3d18be8d5c91 # AAP-95746
        with:
          allow_no_jira: true
