---
name: DVCS (Find Jira Key)
on:
  pull_request_target:
jobs:
  dvcs_pr_checker:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    name: Check the PR for DVCS integration
    steps:
      - uses: ansible/dvcs-action@4f8696a8670ad9c5e92c9866106a0c8bb58b507b # AAP-95746
        with:
          allow_no_jira: true
