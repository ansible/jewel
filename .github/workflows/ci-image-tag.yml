---
# Resolve and verify the quay.io/ansible/jewel-ci tag for a workflow run.
#
# merge_group.base_ref is refs/heads/<branch>; pull_request github.base_ref
# and push github.ref_name are already the branch name. GitHub Actions
# expressions have no replace() function, so the prefix is stripped in bash.
name: Resolve CI image tag
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to turn into a jewel-ci tag (may include refs/heads/)
        required: true
        type: string
    outputs:
      tag:
        description: jewel-ci image tag (branch name without refs/heads/)
        value: ${{ jobs.resolve.outputs.tag }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve jewel-ci tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          REF: ${{ inputs.ref }}
        run: |
          TAG="${REF#refs/heads/}"
          if [ -z "$TAG" ]; then
            echo "Unable to resolve jewel-ci image tag from ref" >&2
            exit 1
          fi
          case "$TAG" in
            [-.]*|*[!A-Za-z0-9_.-]*)
              echo "CI image tags must use only letters, numbers, underscores, periods, and hyphens, and cannot begin with a period or hyphen" >&2
              exit 1
              ;;
          esac
          if [ "${#TAG}" -gt 117 ]; then
            echo "CI image tags cannot exceed 117 characters because generated image tags include a suffix" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify CI image exists
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          IMAGE="quay.io/ansible/jewel-ci:${TAG}"
          if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error title=Missing CI image::${IMAGE} does not exist. Run the Build CI Image workflow manually with branch '${TAG}', then re-run this workflow."
            exit 1
          fi
