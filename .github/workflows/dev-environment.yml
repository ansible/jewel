---
# Dev Environment Tests Workflow for aap-gateway
# Any tests that require the dev environment to be running should be in here.
#
# This is a reusable workflow that can be called from other workflows.
# It's called from sanity.yml after sanity checks complete.
#
# FLOW: Sanity checks pass → sanity.yml calls this workflow → dev environment tests run
#
# This ensures sanity checks pass before running expensive dev environment tests which require secrets.
name: Dev environment tests
env:
  LC_ALL: "C.UTF-8" # prevent ERROR: Ansible could not initialize the preferred locale: unsupported locale setting
on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
        type: string
      pr_head_sha:
        description: 'PR head SHA to checkout'
        required: true
        type: string
      pr_base:
        description: 'PR base branch'
        required: true
        type: string
      pr_head_repo:
        description: 'PR head repository (full name)'
        required: true
        type: string
      pr_body:
        description: 'PR body'
        required: false
        type: string
        default: ''
    secrets:
      GITHUB_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  dev-env-tests:
    name: Dev environment tests
    runs-on: ubuntu-latest
    env:
      HEADLESS: "yes"
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_sha }}

      - name: Set PR metadata and protect against fork attacks
        env:
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_BASE: ${{ inputs.pr_base }}
          PR_HEAD_REPO: ${{ inputs.pr_head_repo }}
          PR_BODY: ${{ inputs.pr_body }}
        run: |
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "PR_BASE=$PR_BASE" >> $GITHUB_ENV

          # Store PR_BODY in environment variable (multiline support)
          # Using printf '%s\n' to preserve exact content without interpreting
          # escape sequences, while ensuring the trailing newline required for
          # GITHUB_ENV heredoc EOF delimiter.
          echo "PR_BODY<<EOF" >> $GITHUB_ENV
          printf '%s\n' "$PR_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "Successfully loaded PR metadata (target branch: $PR_BASE)"

          # Security check: Is this PR from a fork or from the main repo?
          # Forks are untrusted (external contributors)
          # Main repo PRs are trusted (contributors with write access)
          echo ""
          echo "🔒 Security Check"
          echo "=================="
          echo "Base repo: $REPO_NAME"
          echo "PR head repo: $PR_HEAD_REPO"

          if [ "$PR_HEAD_REPO" != "$REPO_NAME" ]; then
            echo "⚠️  PR is from a FORK - using trusted base branch scripts for security"
            echo ""
            echo "Replacing scripts that access secrets with trusted versions from $PR_BASE:"
            git fetch origin "$PR_BASE"
            git checkout "origin/$PR_BASE" -- tools/scripts/get_pr_checkout.py
            echo "  ✅ get_pr_checkout.py (accesses GH_TOKEN and GITHUB_TOKEN)"
            echo ""
            echo "Note: Changes to this script in this PR will NOT be tested."
            echo "If this PR modifies this script, it must be reviewed and tested manually."
          else
            echo "✅ PR is from MAIN REPO - trusted contributor, using PR's versions of all scripts"
            echo "   All files from PR (including any script changes) will be tested"
          fi

      - name: Checkout dependencies
        env:
          PR_BODY: ${{ env.PR_BODY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN != '' && secrets.GITHUB_TOKEN || github.token }}
        run: |
          python tools/scripts/get_pr_checkout.py \
            --always-clone-repos 'ansible/django-ansible-base' \
            --always-clone-repos ansible/ansible.platform

      - name: Install make
        run: sudo apt install make

      - name: Install python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install test dependencies
        run: |
          pip3.12 install --upgrade -r ansible.platform/requirements/requirements_dev.txt ansible-core
          pip3.12 install openapi-spec-validator

      - name: Configure faster xDS refresh for CI
        # Default xDS refresh is 60 seconds, which is too slow for CI.
        # If Envoy polls mid-configuration and rejects a listener, it won't
        # retry for 60 seconds, causing flaky smoke tests.
        run: |
          sed -i 's/xds_refresh_delay_seconds: 60/xds_refresh_delay_seconds: 5/' tools/configs/container-startup.yml
          echo "Set xds_refresh_delay_seconds to 5 seconds for faster CI feedback"

      - name: Start the dev environment
        run: COMPOSE_UP_OPTS='-d' make docker-compose

      - name: Run smoke test
        id: smoke_test
        continue-on-error: true
        run: |
          ansible-playbook -v tools/ansible/smoke-test.yml \
            -e repo_root=$(pwd) \
            -e gateway_vars=$(readlink -f container-startup.yml) \
            --skip-tags start_dev_environment,dump_container_logs
          echo "✅ Smoke test passed"

      - name: Run collection completeness test
        id: collection_test
        continue-on-error: true
        run: |
          cp container-startup.yml ansible.platform && \
          cd ansible.platform && \
          GATEWAY_PASSWORD=$(grep 'gateway_admin_password:' container-startup.yml | awk '{print $2}' | tr -d "'\"") && \
          export GATEWAY_PASSWORD && \
          make collection-test-completeness
          echo "✅ Collection completeness test passed"

      - name: Run OpenAPI schema validation
        id: openapi_test
        continue-on-error: true
        run: |
          python3 -c "
          import ssl
          from openapi_spec_validator import validate_url
          from openapi_spec_validator.validation.validators import OpenAPIV30SpecValidator

          ssl._create_default_https_context = ssl._create_unverified_context
          validate_url('https://localhost:8000/api/gateway/v1/docs/schema/', cls=OpenAPIV30SpecValidator)
          "
          echo "✅ OpenAPI schema validation passed"

      - name: Check test results
        if: always()
        run: |
          FAILED_TESTS=()

          if [ "${{ steps.smoke_test.outcome }}" != "success" ]; then
            FAILED_TESTS+=("Smoke test")
          fi

          if [ "${{ steps.collection_test.outcome }}" != "success" ]; then
            FAILED_TESTS+=("Collection completeness test")
          fi

          if [ "${{ steps.openapi_test.outcome }}" != "success" ]; then
            FAILED_TESTS+=("OpenAPI schema validation")
          fi

          if [ ${#FAILED_TESTS[@]} -gt 0 ]; then
            echo "##[error]❌ The following tests failed:"
            for test in "${FAILED_TESTS[@]}"; do
              echo "##[error]  - $test"
            done
            exit 1
          else
            echo "✅ All tests passed"
          fi

      - name: Dump the container logs on failure
        if: failure()
        run: docker compose -f tools/generated/docker-compose.yml logs
