---
name: Build CI Image
on:
  push:
    branches:
      - devel
      - stable-*
    paths:
      - 'requirements/requirements.txt'
      - 'requirements/requirements_test.txt'
      - 'requirements/requirements_dev.txt'
      - 'requirements/requirements_ci.in'
      - 'requirements/requirements_ci.txt'
      - 'requirements/requirements_test_ci.in'
      - 'requirements/requirements_test_ci.txt'
      - 'Makefile'
      - 'tools/ansible/roles/sources/tasks/main.yml'
      - 'tools/ansible/roles/sources/templates/Containerfile.j2'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch name to build and tag as a jewel-ci image
        required: true
        type: string
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

permissions:
  contents: read

env:
  IMAGE_NAME: quay.io/ansible/jewel-ci

jobs:
  build-and-push:
    name: Build and push CI image
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'ansible/jewel' &&
      (github.event_name == 'workflow_dispatch' || github.ref_name == 'devel' || startsWith(github.ref_name, 'stable-'))
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Podman
        uses: redhat-actions/podman-install@072203a124c069d8fc8621c1a33f9fa9510ae2e1 # v1.1.1

      - name: Install source-generation dependency
        run: |
          python -m pip install --only-binary :all: ansible-core==2.21.1

      - name: Determine CI image tag
        id: branch
        env:
          BRANCH_NAME: ${{ inputs.branch || github.ref_name }}
        run: |
          case "$BRANCH_NAME" in
            ''|[-.]*|*[!A-Za-z0-9_.-]*)
              echo "Branch name must be a non-empty, container-tag-safe value that does not begin with a period or hyphen" >&2
              exit 1
              ;;
          esac
          if [ "${#BRANCH_NAME}" -gt 117 ]; then
            echo "Branch name is too long for generated container tags (maximum: 117 characters)" >&2
            exit 1
          fi
          printf 'name=%s\n' "$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Log in to Quay.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Generate image metadata
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          DATE_TAG=$(date -u +%Y-%m-%d)
          printf 'short_sha=%s\n' "$SHORT_SHA" >> "$GITHUB_OUTPUT"
          printf 'date_tag=%s\n' "$DATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build CI image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: make ci-image "CI_IMAGE=${IMAGE_REF}:${BRANCH_NAME}"

      - name: Tag additional versions
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          DATE_TAG: ${{ steps.tags.outputs.date_tag }}
        run: |
          podman tag "${IMAGE_REF}:${BRANCH_NAME}" "${IMAGE_REF}:${BRANCH_NAME}-${SHORT_SHA}"
          podman tag "${IMAGE_REF}:${BRANCH_NAME}" "${IMAGE_REF}:${BRANCH_NAME}-${DATE_TAG}"

      - name: Push all tags
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          DATE_TAG: ${{ steps.tags.outputs.date_tag }}
        run: |
          podman push "${IMAGE_REF}:${BRANCH_NAME}"
          podman push "${IMAGE_REF}:${BRANCH_NAME}-${SHORT_SHA}"
          podman push "${IMAGE_REF}:${BRANCH_NAME}-${DATE_TAG}"
