[project]
name = "jewel"
authors = [{ name = "Ansible community", email = "info@ansible.com" }]
description = "gateway"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ansible", "django", "gateway"]
license = { text = "Apache-2.0" }
classifiers = [
  "Framework :: Django",
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dynamic = ["version", "dependencies"]


[tool.setuptools.dynamic]
dependencies = { file = [
  "requirements/requirements.in",
  "requirements/requirements_git.txt",
] }
version = { attr = "aap_gateway_api.__version__" }


[tool.setuptools.packages.find]
include = ["aap_gateway_api*"]
exclude = ["aap_gateway_api.tests*"]

[tool.setuptools.package-data]
"aap_gateway_api.templates" = ["**"]
"aap_gateway_api.static" = ["**"]

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8,<9"]
build-backend = 'setuptools.build_meta'

[project.scripts]
aap-gateway-manage = "aap_gateway_api:manage"

[tool.ruff]
line-length = 160
target-version = "py312"
exclude = [
    "migrations",
    "django-ansible-base",
    "aap-dev",
    "services",
    ".tox",
]

[tool.ruff.lint]
extend-ignore = ["E203"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]

[tool.ruff.format]
skip-magic-trailing-comma = false
quote-style = "preserve"
docstring-code-format = false

[tool.ruff.lint.isort]
force-wrap-aliases = false
split-on-trailing-comma = false

[tool.ruff.lint.extend-per-file-ignores]
# Migrations are auto-generated and should not be modified for style
"aap_gateway_api/migrations/*" = ["E501", "F401", "F403"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "aap_gateway_api.tests.settings_overrides"
addopts = "--strict-markers --reuse-db --create-db --migrations -s -vvv"
pythonpath = ". aap_gateway_api"
markers = [
]

[tool.tox]
legacy_tox_ini = """
    [tox]
    min_version = 4.0
    no_package = true
    env_list =
        check
        check-migrations
        check-oauth2-permissions
        check-help-text
        py312
        py312-django42
        py312-django52
        312
        py311
        311
        check-lint

    labels =
        test = py312
        312 = py312
        311 = py311
        check = check, check-migrations, check-oauth2-permissions, check-help-text
        lint = ruff-check, ruff-format

    [docker:db]
    ## NOTE: If you see this failing with KeyError: 'Gateway' (Docker API 1.52+ removed that field),
    ## set TOX_DOCKER_GATEWAY=0.0.0.0 in the environment where tox is run (CI sets this automatically).
    ## Alternative: apply patch from https://github.com/tox-dev/tox-docker/pull/196

    image = quay.io/sclorg/postgresql-15-c9s
    environment =
        POSTGRESQL_PASSWORD=password
        POSTGRESQL_ADMIN_PASSWORD=password
        POSTGRESQL_USER=gw
        POSTGRESQL_DATABASE=gw_db
    healthcheck_cmd = PGPASSWORD=$POSTGRESQL_PASSWORD psql \
        --user=$POSTGRESQL_USER --dbname=$POSTGRESQL_DATABASE \
        --host=127.0.0.1 --quiet --no-align --tuples-only \
        -1 --command="SELECT 1"
    healthcheck_timeout = 5
    healthcheck_retries = 5
    healthcheck_interval = 10
    healthcheck_start_period = 3
    expose =
        DB_PORT=5432/tcp
    host_var = ANSIBLE_GW_TEST_DB_HOST

    [testenv]
    deps =
        -r{toxinidir}/requirements/requirements_test.txt

    [testenv:py311,py312,py312-django42,py312-django52]
    allowlist_externals =
        ./tools/scripts/ci/tox-reinstall-django-ansible-base.sh
        ./tools/scripts/ci/install_django_venv.sh
        ./tools/scripts/run_tests.sh
    docker = db
    passenv = 
        ANSIBLE_GW_TEST_DB_HOST
        DB_PORT
    ## The CFLAGS env variable below is a workaround for issue:
    ## https://github.com/xmlsec/python-xmlsec/issues/323
    setenv =
        PYTHONPATH = {toxinidir}/django-ansible-base/
        GATEWAY_SECRET_KEY_FILE = {toxinidir}/tools/configs/dev_secret_key
        CFLAGS="-Wno-error=incompatible-pointer-types"
    install_command = ./tools/scripts/ci/install_django_venv.sh {envname} {opts} {packages}
    commands =
        ./tools/scripts/ci/tox-reinstall-django-ansible-base.sh {envname}
        ./tools/scripts/run_tests.sh {posargs}

    [testenv:check]
    allowlist_externals =
        ./tools/scripts/ci/tox-reinstall-django-ansible-base.sh
        ./tools/scripts/ci/install_django_venv.sh
    setenv =
        PYTHONPATH = {toxinidir}:{toxinidir}/django-ansible-base/
        GATEWAY_SECRET_KEY_FILE = {toxinidir}/tools/configs/dev_secret_key
        DATABASE_ENGINE = django.db.backends.dummy
    deps =
        -r{toxinidir}/requirements/requirements.txt
        -r{toxinidir}/requirements/requirements_git.txt
        -r{toxinidir}/requirements/requirements_test.txt
        psycopg[binary]
    commands =
        ./tools/scripts/ci/tox-reinstall-django-ansible-base.sh {envname}
        python3 -m aap_gateway_api check

    [testenv:check-migrations]
    allowlist_externals =
        ./tools/scripts/ci/tox-reinstall-django-ansible-base.sh
        ./tools/scripts/ci/install_django_venv.sh
    setenv =
        PYTHONPATH = {toxinidir}:{toxinidir}/django-ansible-base/
        GATEWAY_SECRET_KEY_FILE = {toxinidir}/tools/configs/dev_secret_key
        DATABASE_ENGINE = django.db.backends.dummy
    deps =
        -r{toxinidir}/requirements/requirements.txt
        -r{toxinidir}/requirements/requirements_git.txt
        -r{toxinidir}/requirements/requirements_test.txt
         psycopg[binary]
    commands =
        ./tools/scripts/ci/tox-reinstall-django-ansible-base.sh {envname}
        python3 -m aap_gateway_api makemigrations --check

    [testenv:check-oauth2-permissions]
    allowlist_externals =
        ./tools/scripts/ci/tox-reinstall-django-ansible-base.sh
        ./tools/scripts/ci/install_django_venv.sh
    setenv =
        PYTHONPATH = {toxinidir}:{toxinidir}/django-ansible-base/
        GATEWAY_SECRET_KEY_FILE = {toxinidir}/tools/configs/dev_secret_key
        DATABASE_ENGINE = django.db.backends.dummy
    deps =
        -r{toxinidir}/requirements/requirements.txt
        -r{toxinidir}/requirements/requirements_git.txt
        -r{toxinidir}/requirements/requirements_test.txt
        psycopg[binary]
    commands =
        ./tools/scripts/ci/tox-reinstall-django-ansible-base.sh {envname}
        python3 -m aap_gateway_api check --deploy --tag oauth2_permissions

    [testenv:check-help-text]
    allowlist_externals =
        ./tools/scripts/ci/tox-reinstall-django-ansible-base.sh
        ./tools/scripts/ci/install_django_venv.sh
    setenv =
        PYTHONPATH = {toxinidir}:{toxinidir}/django-ansible-base/
        GATEWAY_SECRET_KEY_FILE = {toxinidir}/tools/configs/dev_secret_key
        DATABASE_ENGINE = django.db.backends.dummy
    install_command = ./tools/scripts/ci/install_django_venv.sh {envname} {opts} {packages}
    commands =
        ./tools/scripts/ci/tox-reinstall-django-ansible-base.sh {envname}
        python3 -m aap_gateway_api help_text_check --applications=aap_gateway_api --ignore-file ./.help_text_check.ignore

    [testenv:ruff-check]
    deps =
        ruff==0.14.1
    docker =
    commands = ruff check {posargs:.}

    [testenv:ruff-format]
    deps =
        ruff==0.14.1
    docker =
    commands = ruff format {posargs:.}

    [testenv:check-lint]
    deps =
        ruff==0.14.1
    docker =
    commands =
        ruff check .
        ruff format --check .
"""

[tool.coverage.run]
omit = ["aap_gateway_api/tests/*", "django-ansible-base/*"]
relative_files = true
